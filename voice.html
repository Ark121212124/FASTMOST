<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTMOST • Voice</title>

<meta name="theme-color" content="#5865f2">

<style>
/* ===== THEMES ===== */
body[data-theme="purple"]{--accent:#5865f2;--bg:#070b16}
body[data-theme="cyber"]{--accent:#00ffe1;--bg:#020d0c}
body[data-theme="red"]{--accent:#ff3b3b;--bg:#120405}

:root{
  --panel:rgba(20,25,45,.65);
  --text:#e6e9ff;
  --blur:blur(16px);
}

*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  background:
    radial-gradient(1200px 600px at top,var(--accent)12%,transparent),
    var(--bg);
  font-family:Inter,system-ui;
  color:var(--text);
  overflow:hidden;
}

/* ===== HEADER ===== */
header{
  height:64px;
  padding:0 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel);
  backdrop-filter:var(--blur);
}

header button{
  background:var(--accent);
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
}

/* ===== VOICE AREA ===== */
#voice{
  position:absolute;
  top:64px;
  bottom:0;
  left:0;
  right:0;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

/* ===== OVERLAY CONTROLS ===== */
.controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:14px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  padding:12px 18px;
  border-radius:18px;
}

.controls button{
  background:var(--accent);
  border:none;
  padding:10px 16px;
  border-radius:12px;
  color:#fff;
  cursor:pointer;
}

/* ===== SMALL INFO ===== */
.info{
  position:absolute;
  top:80px;
  left:20px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  padding:10px 14px;
  border-radius:14px;
  font-size:14px;
}
</style>
</head>

<body data-theme="purple">

<header>
  <button onclick="location.href='index.html'">← Назад</button>
  <strong>FASTMOST • Voice</strong>
  <button onclick="switchTheme()">🎨</button>
</header>

<div id="voice"></div>

<div class="info">
  🎧 Voice-комната
</div>

<div class="controls">
  <button onclick="mute()">🔇 Mute</button>
  <button onclick="unmute()">🎤 Unmute</button>
  <button onclick="leave()">🚪 Выйти</button>
</div>

<script>
/* ===== ROOM ===== */
const params = new URLSearchParams(location.search);
const room = params.get("room") || "fastmost";

/* ===== USER ===== */
const name = "User-" + Math.floor(Math.random()*9999);

/* ===== JITSI ===== */
const domain = "meet.jit.si";
const options = {
  roomName: "FASTMOST_" + room,
  parentNode: document.getElementById("voice"),
  userInfo: { displayName: name },
  configOverwrite: {
    startWithAudioMuted: false,
    prejoinPageEnabled: false
  },
  interfaceConfigOverwrite: {
    TOOLBAR_BUTTONS: []
  }
};

const api = new JitsiMeetExternalAPI(domain, options);

/* ===== CONTROLS ===== */
function mute(){ api.executeCommand("mute"); }
function unmute(){ api.executeCommand("unmute"); }
function leave(){
  api.dispose();
  location.href="index.html";
}

/* ===== THEME ===== */
const themes=["purple","cyber","red"];
let t=0;
function switchTheme(){
  t=(t+1)%themes.length;
  document.body.dataset.theme=themes[t];
}
</script>

<script src="https://meet.jit.si/external_api.js"></script>

</body>
</html>
