<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST Voice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://meet.jit.si/external_api.js"></script>

<style>
body{
  margin:0;
  background:#0b0e14;
  color:white;
  font-family:Inter,system-ui;
}
header{
  height:56px;
  background:#141827;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}
button{
  background:#5865f2;
  border:none;
  padding:8px 14px;
  color:white;
  border-radius:10px;
  cursor:pointer;
}
#jitsi{
  height:calc(100vh - 56px);
}
</style>
</head>

<body>

<header>
  <b>🔊 FASTMOST Voice</b>
  <button onclick="location.href='index.html'">← Назад</button>
</header>

<div id="jitsi"></div>

<script>
const room = new URLSearchParams(location.search).get("room");

const api = new JitsiMeetExternalAPI("meet.jit.si",{
  roomName: "FASTMOST_" + room,
  parentNode: document.getElementById("jitsi"),
  width: "100%",
  height: "100%",

  userInfo: {
    displayName: "FASTMOST User"
  },

  configOverwrite: {
    startWithAudioMuted: false,
    startWithVideoMuted: true,
    disableModeratorIndicator: true,
    prejoinPageEnabled: false,
    enableTalkWhileMuted: false,
    toolbarButtons: [
      "microphone",
      "settings",
      "hangup"
    ]
  },

  interfaceConfigOverwrite: {
    SHOW_JITSI_WATERMARK: false,
    SHOW_WATERMARK_FOR_GUESTS: false,
    DEFAULT_BACKGROUND: "#0b0e14"
  }
});

// 🔊 ЯВНО ВКЛЮЧАЕМ МИКРОФОН
api.addEventListener("videoConferenceJoined", () => {
  api.executeCommand("toggleAudio");
});

// 🔍 ЛОГ ДЛЯ ПРОВЕРКИ
api.addEventListener("audioMuteStatusChanged", e => {
  console.log("Mic muted:", e.muted);
});
</script>

</body>
</html>
