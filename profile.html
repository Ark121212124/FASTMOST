<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST — Профиль</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  height:100vh;
  background:#0b0e14;
  font-family:Inter;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
}
.card{
  background:#141827;
  padding:30px;
  border-radius:22px;
  width:360px;
  text-align:center;
}
.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  margin:auto;
}
input{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:12px;
  border:none;
  background:#0f1324;
  color:white;
}
button{
  margin-top:14px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#5865f2;
  color:white;
  font-weight:600;
  cursor:pointer;
}
.small{
  margin-top:10px;
  color:#8b90b3;
  font-size:13px;
}
</style>
</head>
<body>

<div class="card">
  <div class="avatar" id="ava">👤</div>
  <h2 id="email">...</h2>

  <input id="avatarUrl" placeholder="Ссылка на аватар">
  <button onclick="saveAvatar()">Сохранить аватар</button>

  <div class="small" id="status">Статус: ...</div>

  <button onclick="logout()">Выйти</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain:"fastmost-f8084.firebaseapp.com",
  projectId:"fastmost-f8084",
  databaseURL:"https://fastmost-f8084-default-rtdb.firebaseio.com"
});

const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

let uid=null;

onAuthStateChanged(auth, async user=>{
  if(!user) return location.href="index.html";
  uid=user.uid;
  email.innerText=user.email;

  const snap=await getDoc(doc(db,"users",uid));
  if(snap.exists() && snap.data().avatar){
    ava.innerHTML=`<img src="${snap.data().avatar}" style="width:100%;height:100%;border-radius:50%">`;
  }

  onValue(ref(rtdb,"status/"+uid), s=>{
    if(s.exists()){
      status.innerText = s.val().online ? "Статус: Онлайн 🟢" : "Статус: Оффлайн ⚫";
    }
  });
});

window.saveAvatar=async()=>{
  if(!avatarUrl.value) return;
  await setDoc(doc(db,"users",uid),{avatar:avatarUrl.value},{merge:true});
  ava.innerHTML=`<img src="${avatarUrl.value}" style="width:100%;height:100%;border-radius:50%">`;
};

window.logout=async()=>{
  await signOut(auth);
  location.href="index.html";
};
</script>

</body>
</html>
