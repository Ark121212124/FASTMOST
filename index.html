<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084",
  messagingSenderId: "153310068244",
  appId: "1:153310068244:web:f0cce97ba520da38dc3101"
};

const LOGO = "https://i.imgur.com/8Km9tLL.png";

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= HELPERS ================= */
function gravatar(email){
  return "https://www.gravatar.com/avatar/" +
    CryptoJS.MD5(email.trim().toLowerCase()).toString() +
    "?d=identicon&s=120";
}

/* ================= AUTH ================= */
window.register = async () => {
  try {
    const email = emailInput.value.trim();
    const pass = passwordInput.value.trim();
    if(!email || !pass) return alert("Введите email и пароль");

    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await sendEmailVerification(cred.user);

    await setDoc(doc(db,"users",cred.user.uid),{
      email,
      avatar: gravatar(email),
      profileDone: false
    });

    alert("Подтвердите email и войдите");
  } catch(e){
    alert(e.message);
  }
};

window.login = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      emailInput.value.trim(),
      passwordInput.value.trim()
    );
  } catch(e){
    alert(e.message);
  }
};

window.logout = async () => {
  await signOut(auth);
  location.reload();
};

/* ================= AVATAR ================= */
window.saveAvatar = async () => {
  try {
    const user = auth.currentUser;
    const url = avatarUrl.value.trim();
    const avatar = url || gravatar(user.email);

    await setDoc(doc(db,"users",user.uid),{
      avatar,
      profileDone:true
    },{merge:true});

    showMain(user.email, avatar);
  } catch(e){
    alert(e.message);
  }
};

/* ================= UI ================= */
function showAuth(){
  authBox.style.display="flex";
  profileBox.style.display="none";
  mainBox.style.display="none";
}

function showProfile(avatar,email){
  authBox.style.display="none";
  profileBox.style.display="flex";
  mainBox.style.display="none";
  avatarImg.src = avatar;
  profileEmail.innerText = email;
}

function showMain(email,avatar){
  authBox.style.display="none";
  profileBox.style.display="none";
  mainBox.style.display="flex";
  mainAvatar.src = avatar;
  mainEmail.innerText = email;
}

/* ================= STATE ================= */
onAuthStateChanged(auth, async user => {
  logo1.src = logo2.src = logo3.src = LOGO;

  if(!user) return showAuth();
  if(!user.emailVerified) return alert("Подтвердите email");

  const snap = await getDoc(doc(db,"users",user.uid));
  const data = snap.data();
  const avatar = data.avatar || gravatar(user.email);

  data.profileDone
    ? showMain(user.email, avatar)
    : showProfile(avatar, user.email);
});
</script>

<style>
body{margin:0;background:#0b0e14;color:white;font-family:Inter}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#141827;padding:32px;border-radius:18px;width:360px;text-align:center}
.logo{width:64px}
.brand{font-size:28px;font-weight:900;color:#6b7cff}
input,button{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:none}
input{background:#0f1324;color:white;border:1px solid #242a45}
button{background:#6b7cff;color:white;cursor:pointer}
.avatar{width:96px;height:96px;border-radius:50%;border:2px solid #6b7cff;margin:12px auto}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authBox" class="center">
  <div class="card">
    <img id="logo1" class="logo">
    <div class="brand">FASTMOST</div>
    <input id="emailInput" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Пароль">
    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- PROFILE -->
<div id="profileBox" class="center" style="display:none">
  <div class="card">
    <img id="logo2" class="logo">
    <div class="brand">FASTMOST</div>
    <img id="avatarImg" class="avatar">
    <input id="avatarUrl" placeholder="Ссылка на аватар">
    <button onclick="saveAvatar()">Сохранить и продолжить</button>
    <p id="profileEmail"></p>
  </div>
</div>

<!-- MAIN -->
<div id="mainBox" class="center" style="display:none">
  <div class="card">
    <img id="logo3" class="logo">
    <div class="brand">FASTMOST</div>
    <img id="mainAvatar" class="avatar">
    <p id="mainEmail"></p>
    <button onclick="alert('Комнаты скоро')">➕ Создать комнату</button>
    <button onclick="logout()">Выйти</button>
  </div>
</div>

</body>
</html>
