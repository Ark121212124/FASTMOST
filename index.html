<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase (ES modules) -->
<script type="module">
/* ===== IMPORTS ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* ===== FIREBASE CONFIG (ТВОИ КЛЮЧИ) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084",
  storageBucket: "fastmost-f8084.firebasestorage.app",
  messagingSenderId: "153310068244",
  appId: "1:153310068244:web:f0cce97ba520da38dc3101",
  measurementId: "G-QJFEKWN6HS"
};

/* ===== INIT ===== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const storage = getStorage(app);

/* ===== ELEMENTS ===== */
const authBox = document.getElementById("auth");
const appBox = document.getElementById("app");
const emailInput = document.getElementById("email");
const passInput = document.getElementById("password");
const userEmail = document.getElementById("userEmail");
const avatarImg = document.getElementById("avatar");

/* ===== AUTH LOGIC ===== */
window.register = async () => {
  const email = emailInput.value.trim();
  const pass = passInput.value.trim();

  if (!email || !pass) {
    alert("Введите email и пароль");
    return;
  }

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await sendEmailVerification(cred.user);
    alert("Письмо подтверждения отправлено на почту");
  } catch (e) {
    alert(e.message);
  }
};

window.login = async () => {
  try {
    await signInWithEmailAndPassword(auth, emailInput.value, passInput.value);
  } catch (e) {
    alert(e.message);
  }
};

window.logout = async () => {
  await signOut(auth);
  location.reload();
};

onAuthStateChanged(auth, user => {
  if (!user) {
    authBox.style.display = "flex";
    appBox.style.display = "none";
    return;
  }

  if (!user.emailVerified) {
    alert("Подтвердите email, затем обновите страницу");
    return;
  }

  authBox.style.display = "none";
  appBox.style.display = "block";
  userEmail.innerText = user.email;

  if (user.photoURL) {
    avatarImg.src = user.photoURL;
  }
});

/* ===== AVATAR UPLOAD ===== */
window.uploadAvatar = async file => {
  if (!file) return;

  const user = auth.currentUser;
  const avatarRef = ref(storage, "avatars/" + user.uid);

  await uploadBytes(avatarRef, file);
  const url = await getDownloadURL(avatarRef);

  await updateProfile(user, { photoURL: url });
  avatarImg.src = url;
};
</script>

<style>
body{
  margin:0;
  background:#0b0e14;
  color:#fff;
  font-family:Inter,Segoe UI,Arial;
}

#auth, #app{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:#141827;
  padding:32px;
  border-radius:18px;
  width:100%;
  max-width:360px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  text-align:center;
}

.brand{
  font-size:32px;
  font-weight:900;
  color:#6b7cff;
}

input{
  width:100%;
  padding:14px;
  margin-top:14px;
  border-radius:12px;
  border:1px solid #242a45;
  background:#0f1324;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:16px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#6b7cff,#8b98ff);
  color:white;
  cursor:pointer;
}

.profile{
  text-align:center;
}

.profile img{
  width:96px;
  height:96px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #6b7cff;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">
  <div class="card">
    <div class="brand">FASTMOST</div>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Пароль">
    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="card profile">
    <div class="brand">FASTMOST</div>
    <img id="avatar" src="">
    <input type="file" accept="image/*" onchange="uploadAvatar(this.files[0])">
    <p id="userEmail"></p>
    <button onclick="logout()">Выйти</button>
  </div>
</div>

</body>
</html>
