<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:Inter,system-ui;
  background:#0b0e14;
  color:#fff;
}
.app{
  display:grid;
  grid-template-columns:80px 260px 1fr 240px;
  height:100vh;
}

/* LEFT ICON BAR */
.nav{
  background:#0d111c;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:12px 0;
}
.nav .logo{
  width:44px;height:44px;
  border-radius:14px;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

/* ROOMS */
.rooms{
  background:#11162a;
  padding:14px;
  display:flex;
  flex-direction:column;
}
.rooms h3{
  margin:0 0 10px;
  opacity:.7;
}
.rooms input{
  background:#0b0f1f;
  border:none;
  border-radius:10px;
  padding:10px;
  color:white;
}
.rooms button{
  margin-top:8px;
  background:#5865f2;
  border:none;
  padding:10px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}
.room{
  padding:10px;
  border-radius:10px;
  margin-top:6px;
  cursor:pointer;
}
.room:hover{background:#1a2040}

/* CHAT */
.chat{
  display:flex;
  flex-direction:column;
  background:linear-gradient(180deg,#0f1426,#0b0e14);
}
.chat-header{
  padding:14px;
  background:#12183a;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.messages{
  flex:1;
  padding:16px;
  overflow-y:auto;
}
.msg{
  margin-bottom:10px;
}
.msg span{
  opacity:.6;
  font-size:12px;
}
.chat-input{
  display:flex;
  gap:10px;
  padding:12px;
  background:#0e1328;
}
.chat-input input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#0b0f1f;
  color:white;
}
.chat-input button{
  width:44px;
  border:none;
  border-radius:12px;
  background:#5865f2;
  cursor:pointer;
}

/* USERS */
.users{
  background:#0d111c;
  padding:14px;
}
.user{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3ba55d;
}
</style>
</head>

<body>

<div class="app">

  <!-- ICON BAR -->
  <div class="nav">
    <div class="logo">FM</div>
  </div>

  <!-- ROOMS -->
  <div class="rooms">
    <h3>Комнаты</h3>
    <input id="roomName" placeholder="Новая комната">
    <button onclick="createRoom()">Создать</button>
    <div id="roomList"></div>
  </div>

  <!-- CHAT -->
  <div class="chat">
    <div class="chat-header">
      <b id="roomTitle">Выберите комнату</b>
      <button onclick="joinVoice()">🎙 Voice</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="chat-input">
      <input id="msgInput" placeholder="Сообщение...">
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- USERS -->
  <div class="users">
    <h3>Онлайн</h3>
    <div id="userList"></div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getAuth, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore, collection, addDoc,
  onSnapshot, query, orderBy, serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

let currentRoom = null;
let userEmail = "";

onAuthStateChanged(auth,user=>{
  if(!user) location.href="login.html";
  userEmail = user.email;
  loadRooms();
  loadUsers();
});

function loadRooms(){
  onSnapshot(collection(db,"rooms"),snap=>{
    roomList.innerHTML="";
    snap.forEach(doc=>{
      const d = doc.data();
      const div = document.createElement("div");
      div.className="room";
      div.textContent="# "+d.name;
      div.onclick=()=>openRoom(doc.id,d.name);
      roomList.appendChild(div);
    });
  });
}

window.createRoom = async ()=>{
  if(!roomName.value) return;
  await addDoc(collection(db,"rooms"),{
    name:roomName.value,
    createdAt:serverTimestamp()
  });
  roomName.value="";
};

function openRoom(id,name){
  currentRoom=id;
  roomTitle.textContent="# "+name;
  messages.innerHTML="";
  onSnapshot(
    query(collection(db,"rooms",id,"messages"),orderBy("time")),
    snap=>{
      messages.innerHTML="";
      snap.forEach(doc=>{
        const m = doc.data();
        const div=document.createElement("div");
        div.className="msg";
        div.innerHTML=`<span>${m.user}</span><br>${m.text}`;
        messages.appendChild(div);
      });
      messages.scrollTop=99999;
    }
  );
}

window.sendMessage = async ()=>{
  if(!msgInput.value || !currentRoom) return;
  await addDoc(collection(db,"rooms",currentRoom,"messages"),{
    text:msgInput.value,
    user:userEmail,
    time:serverTimestamp()
  });
  msgInput.value="";
};

function loadUsers(){
  onSnapshot(collection(db,"users"),snap=>{
    userList.innerHTML="";
    snap.forEach(doc=>{
      const u=doc.data();
      const div=document.createElement("div");
      div.className="user";
      div.innerHTML=`<div class="dot"></div>${u.email}`;
      userList.appendChild(div);
    });
  });
}

window.joinVoice = ()=>{
  if(!currentRoom) return;
  location.href="voice.html?room="+currentRoom;
};
</script>

</body>
</html>
