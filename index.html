<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root{
  --bg:#0b1020;
  --panel:#121933;
  --panel2:#161f40;
  --accent:#6c7cff;
  --text:#e6e9ff;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{
  margin:0;background:radial-gradient(1200px 600px at top,#1a235a,#060812);
  color:var(--text);
}
header{
  padding:24px;font-size:28px;font-weight:700;
}
.wrapper{padding:24px;display:grid;gap:24px}
.card{
  background:linear-gradient(180deg,var(--panel),#0b1020);
  border-radius:18px;
  padding:20px;
}
h2{margin:0 0 12px;font-size:18px}
.row{display:flex;gap:10px}
input{
  flex:1;
  padding:12px 14px;
  border-radius:12px;
  border:none;
  background:#0e1430;
  color:#fff;
}
button{
  padding:12px 18px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#fff;
  cursor:pointer;
}
.list{margin-top:14px;display:grid;gap:10px}
.room{
  padding:12px 14px;
  background:var(--panel2);
  border-radius:12px;
  cursor:pointer;
}
.room:hover{background:#1d2760}
</style>
</head>
<body>

<header>FASTMOST</header>

<div class="wrapper">

<div class="card">
  <h2>💬 Текстовые комнаты</h2>
  <div class="row">
    <input id="textName" placeholder="Название комнаты">
    <button onclick="createRoom('text')">Создать</button>
  </div>
  <div id="textRooms" class="list"></div>
</div>

<div class="card">
  <h2>🎧 Voice комнаты</h2>
  <div class="row">
    <input id="voiceName" placeholder="Название комнаты">
    <button onclick="createRoom('voice')">Создать</button>
  </div>
  <div id="voiceRooms" class="list"></div>
</div>

</div>

<script>
const rooms = JSON.parse(localStorage.getItem('rooms')||'[]');

function save(){ localStorage.setItem('rooms',JSON.stringify(rooms)); }

function createRoom(type){
  const input = type==='text'?textName:voiceName;
  if(!input.value.trim()) return;
  rooms.push({id:Date.now(),type,name:input.value});
  input.value='';
  save(); render();
}

function render(){
  textRooms.innerHTML='';
  voiceRooms.innerHTML='';
  rooms.forEach(r=>{
    const div=document.createElement('div');
    div.className='room';
    div.textContent='# '+r.name;
    div.onclick=()=>{
      if(r.type==='text') location.href=`chat.html?room=${r.id}`;
      else alert('Voice-страница позже (overlay готов)');
    };
    (r.type==='text'?textRooms:voiceRooms).appendChild(div);
  });
}
render();
</script>
</body>
</html>
