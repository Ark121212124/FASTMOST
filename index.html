<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="page">
  <div class="header">FASTMOST</div>

  <div class="panel">
    <h2>💬 Текстовые комнаты</h2>
    <div class="input-row">
      <input id="textName" placeholder="Название комнаты">
      <button onclick="createRoom('text')">Создать</button>
    </div>
    <div id="textRooms" class="room-list"></div>
  </div>

  <div class="panel">
    <h2>🎧 Voice комнаты</h2>
    <div class="input-row">
      <input id="voiceName" placeholder="Название комнаты">
      <button onclick="createRoom('voice')">Создать</button>
    </div>
    <div id="voiceRooms" class="room-list"></div>
  </div>
</div>

<script>
const rooms = JSON.parse(localStorage.getItem('rooms')||'[]');

function save(){localStorage.setItem('rooms',JSON.stringify(rooms));}

function createRoom(type){
  const input = type==='text'?textName:voiceName;
  if(!input.value.trim()) return;
  rooms.push({id:Date.now(),type,name:input.value});
  input.value='';
  save(); render();
}

function render(){
  textRooms.innerHTML='';
  voiceRooms.innerHTML='';
  rooms.forEach(r=>{
    const div=document.createElement('div');
    div.className='room';
    div.textContent='# '+r.name;
    div.onclick=()=>{
      if(r.type==='text') location.href=`chat.html?room=${r.id}`;
      else alert('Voice overlay скоро');
    };
    (r.type==='text'?textRooms:voiceRooms).appendChild(div);
  });
}
render();
</script>

</body>
</html>
