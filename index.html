<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5865f2">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0b0e14;
  --panel:#141827cc;
  --panel-solid:#141827;
  --accent:#5865f2;
  --text:#e6e8f0;
  --muted:#8b90b3;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:Inter,system-ui;
  background:radial-gradient(circle at top,#1b1f3b,#0b0e14);
  color:var(--text);
}
.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:var(--panel);
  backdrop-filter:blur(18px);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.logo{
  font-size:22px;
  font-weight:800;
}
.btn{
  background:var(--accent);
  border:none;
  padding:14px;
  border-radius:14px;
  color:white;
  font-weight:600;
  cursor:pointer;
}
.btn.secondary{
  background:#2a2f55;
}
.btn:hover{filter:brightness(1.1)}

/* MAIN */
.main{
  flex:1;
  padding:40px;
  overflow:auto;
}
.hero{
  background:linear-gradient(135deg,#5865f2,#3b45a5);
  border-radius:26px;
  padding:40px;
  margin-bottom:30px;
}
.hero h1{margin:0;font-size:36px}
.hero p{opacity:.9}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}
.card{
  background:var(--panel);
  backdrop-filter:blur(14px);
  padding:20px;
  border-radius:20px;
  cursor:pointer;
  transition:.25s;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}
.type{font-size:13px;color:var(--muted)}
.name{font-size:20px;margin-top:6px}

/* ADMIN BTN */
#adminBtn{display:none}
</style>
</head>

<body>

<div class="app">

  <div class="sidebar">
    <div class="logo">FASTMOST</div>

    <button class="btn" onclick="location.href='voice-lobby.html'">🎙 Voice</button>
    <button class="btn secondary" onclick="location.href='profile.html'">👤 Профиль</button>
    <button class="btn secondary" id="adminBtn" onclick="location.href='admin.html'">🛠 Админка</button>
  </div>

  <div class="main">
    <div class="hero">
      <h1>FASTMOST</h1>
      <p>Голосовые и текстовые комнаты нового поколения</p>
    </div>

    <h3>💬 Текстовые комнаты</h3>
    <div class="grid" id="rooms"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore,collection,onSnapshot,doc,getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain:"fastmost-f8084.firebaseapp.com",
  projectId:"fastmost-f8084"
});
const auth=getAuth();
const db=getFirestore();

onAuthStateChanged(auth,async user=>{
  if(!user) return;
  const snap=await getDoc(doc(db,"users",user.uid));
  if(snap.exists() && snap.data().role==="admin"){
    adminBtn.style.display="block";
  }
});

onSnapshot(collection(db,"rooms"),snap=>{
  rooms.innerHTML="";
  snap.forEach(d=>{
    const r=d.data();
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=`<div class="type">💬 Text</div><div class="name">${r.name}</div>`;
    el.onclick=()=>location.href=`chat.html?room=${d.id}`;
    rooms.appendChild(el);
  });
});
</script>

<script>
if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
