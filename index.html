<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTMOST</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5865f2">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ================= THEMES ================= */
body[data-theme="purple"]{--accent:#5865f2;--bg:#070b16}
body[data-theme="cyber"]{--accent:#00ffe1;--bg:#020d0c}
body[data-theme="red"]{--accent:#ff3b3b;--bg:#120405}

:root{
  --panel:rgba(20,25,45,.65);
  --text:#e6e9ff;
  --blur:blur(16px);
}

*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  font-family:Inter,system-ui;
  background:
    radial-gradient(1200px 600px at top,var(--accent)12%,transparent),
    var(--bg);
  color:var(--text);
  display:flex;
}

/* ================= SIDEBAR ================= */
aside{
  width:260px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}

.nav button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  color:var(--text);
  cursor:pointer;
}
.nav button:hover{background:rgba(255,255,255,.1)}

.themeBtn{
  margin-top:auto;
  background:var(--accent);
  color:#fff;
}

/* ================= MAIN ================= */
main{
  flex:1;
  padding:24px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.hero{
  background:linear-gradient(135deg,var(--accent),transparent);
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
}

.hero h1{margin:0}
.hero p{opacity:.8}

/* ================= LOBBY ================= */
.lobby{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  overflow:hidden;
}

.panel{
  background:var(--panel);
  backdrop-filter:var(--blur);
  border-radius:18px;
  padding:16px;
  display:flex;
  flex-direction:column;
}

.panel h3{
  margin:0 0 10px;
  font-size:16px;
}

/* ================= ROOMS ================= */
.rooms{
  flex:1;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.room{
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  cursor:pointer;
}
.room:hover{background:rgba(255,255,255,.1)}

.create{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.create input{
  flex:1;
  padding:8px;
  border-radius:10px;
  border:none;
  background:rgba(0,0,0,.3);
  color:#fff;
}

.create button{
  background:var(--accent);
  border:none;
  padding:8px 12px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body data-theme="purple">

<!-- ================= SIDEBAR ================= -->
<aside>
  <div class="logo">FASTMOST</div>

  <div class="nav">
    <button onclick="location.reload()">🏠 Главная</button>
    <button onclick="location.href='profile.html'">👤 Профиль</button>
    <button onclick="location.href='admin.html'">🛠 Админка</button>
  </div>

  <button class="themeBtn" onclick="switchTheme()">🎨 Сменить тему</button>
</aside>

<!-- ================= MAIN ================= -->
<main>
  <div class="hero">
    <h1>FASTMOST</h1>
    <p>Голосовые и текстовые комнаты нового поколения</p>
  </div>

  <div class="lobby">

    <!-- TEXT ROOMS -->
    <div class="panel">
      <h3>💬 Текстовые комнаты</h3>
      <div class="create">
        <input id="textName" placeholder="Название комнаты">
        <button onclick="createRoom('text')">Создать</button>
      </div>
      <div class="rooms" id="textRooms"></div>
    </div>

    <!-- VOICE ROOMS -->
    <div class="panel">
      <h3>🎧 Voice-комнаты</h3>
      <div class="create">
        <input id="voiceName" placeholder="Название комнаты">
        <button onclick="createRoom('voice')">Создать</button>
      </div>
      <div class="rooms" id="voiceRooms"></div>
    </div>

  </div>
</main>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  // 🔥 ВСТАВЬ СВОЙ CONFIG
});
const db = firebase.firestore();

/* ================= THEME ================= */
const themes=["purple","cyber","red"];
let t=0;
function switchTheme(){
  t=(t+1)%themes.length;
  document.body.dataset.theme=themes[t];
}

/* ================= ROOMS ================= */
function createRoom(type){
  const input = type==="text"?textName:voiceName;
  if(!input.value) return;
  db.collection("rooms").add({
    name:input.value,
    type:type,
    created:Date.now()
  });
  input.value="";
}

db.collection("rooms").onSnapshot(s=>{
  textRooms.innerHTML="";
  voiceRooms.innerHTML="";
  s.forEach(d=>{
    const r=d.data();
    const el=document.createElement("div");
    el.className="room";
    el.textContent="# "+r.name;
    el.onclick=()=>{
      if(r.type==="text")
        location.href=`chat.html?room=${d.id}`;
      else
        location.href=`voice.html?room=${d.id}`;
    };
    (r.type==="text"?textRooms:voiceRooms).appendChild(el);
  });
});
</script>

</body>
</html>
