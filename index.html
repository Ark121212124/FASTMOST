<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CryptoJS для Gravatar -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script type="module">
/* ===== Firebase imports ===== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===== Firebase config (ТВОИ КЛЮЧИ) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084",
  storageBucket: "fastmost-f8084.firebasestorage.app",
  messagingSenderId: "153310068244",
  appId: "1:153310068244:web:f0cce97ba520da38dc3101",
  measurementId: "G-QJFEKWN6HS"
};

/* ===== Init ===== */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===== Utils ===== */
function gravatar(email){
  return "https://www.gravatar.com/avatar/" +
    CryptoJS.MD5(email.trim().toLowerCase()).toString() +
    "?d=identicon&s=120";
}

/* ===== Auth actions ===== */
window.register = async () => {
  const email = emailInput.value.trim();
  const pass = passwordInput.value.trim();
  if(!email || !pass) return alert("Введите email и пароль");

  const cred = await createUserWithEmailAndPassword(auth, email, pass);
  await sendEmailVerification(cred.user);

  await setDoc(doc(db,"users",cred.user.uid),{
    email,
    avatar: gravatar(email)
  });

  alert("Письмо подтверждения отправлено на почту");
};

window.login = async () => {
  await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
};

window.logout = async () => {
  await signOut(auth);
  location.reload();
};

/* ===== Save avatar ===== */
window.saveAvatar = async () => {
  const user = auth.currentUser;
  const url = avatarUrl.value.trim();
  const avatar = url ? url : gravatar(user.email);

  await setDoc(doc(db,"users",user.uid),{
    avatar
  },{merge:true});

  avatarImg.src = avatar;
};

/* ===== Auth state ===== */
onAuthStateChanged(auth, async user => {
  if(!user){
    authBox.style.display="flex";
    appBox.style.display="none";
    return;
  }

  if(!user.emailVerified){
    alert("Подтвердите email и обновите страницу");
    return;
  }

  authBox.style.display="none";
  appBox.style.display="flex";
  userEmail.innerText = user.email;

  const snap = await getDoc(doc(db,"users",user.uid));
  avatarImg.src = snap.exists() ? snap.data().avatar : gravatar(user.email);
});
</script>

<style>
body{
  margin:0;
  background:#0b0e14;
  color:white;
  font-family:Inter,Segoe UI,Arial;
}

.center{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  background:#141827;
  padding:32px;
  border-radius:18px;
  width:100%;
  max-width:380px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

.brand{
  font-size:32px;
  font-weight:900;
  color:#6b7cff;
  margin-bottom:10px;
}

input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  border:1px solid #242a45;
  background:#0f1324;
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#6b7cff,#8b98ff);
  color:white;
  cursor:pointer;
}

.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  margin:10px auto;
  border:2px solid #6b7cff;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authBox" class="center">
  <div class="card">
    <div class="brand">FASTMOST</div>
    <input id="emailInput" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Пароль">
    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>
  </div>
</div>

<!-- APP -->
<div id="appBox" class="center" style="display:none">
  <div class="card">
    <div class="brand">FASTMOST</div>

    <img id="avatarImg" class="avatar">
    <input id="avatarUrl" placeholder="Ссылка на аватар (необязательно)">
    <button onclick="saveAvatar()">Сохранить аватар</button>

    <p id="userEmail"></p>
    <button onclick="logout()">Выйти</button>
  </div>
</div>

</body>
</html>
