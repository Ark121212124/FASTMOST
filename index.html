<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- MD5 для Gravatar -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendEmailVerification,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084",
  messagingSenderId: "153310068244",
  appId: "1:153310068244:web:f0cce97ba520da38dc3101"
};

const FASTMOST_LOGO_URL = "https://i.imgur.com/8Km9tLL.png";

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= HELPERS ================= */
function gravatar(email){
  return "https://www.gravatar.com/avatar/" +
    CryptoJS.MD5(email.trim().toLowerCase()).toString() +
    "?d=identicon&s=120";
}

/* ================= AUTH ================= */
window.register = async () => {
  try {
    const email = emailInput.value.trim();
    const pass = passwordInput.value.trim();
    if(!email || !pass) return alert("Введите email и пароль");

    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await sendEmailVerification(cred.user);

    await setDoc(doc(db,"users",cred.user.uid),{
      email,
      avatar: gravatar(email)
    });

    alert("Письмо подтверждения отправлено на почту");
  } catch(e){
    alert("Ошибка регистрации:\n" + e.message);
  }
};

window.login = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      emailInput.value.trim(),
      passwordInput.value.trim()
    );
  } catch(e){
    alert("Ошибка входа:\n" + e.message);
  }
};

window.logout = async () => {
  await signOut(auth);
  location.reload();
};

/* ================= AVATAR (ИСПРАВЛЕНО) ================= */
window.saveAvatar = async () => {
  try {
    const user = auth.currentUser;
    const input = document.getElementById("avatarUrl");
    const url = input.value.trim();

    if(!url && !user.email){
      return alert("Введите ссылку на аватар");
    }

    const avatar = url || gravatar(user.email);

    await setDoc(
      doc(db,"users",user.uid),
      { avatar },
      { merge:true }
    );

    avatarImg.src = avatar;
    input.value = "";
    alert("Аватар сохранён ✅");
  } catch(e){
    alert("Ошибка сохранения аватара:\n" + e.message);
  }
};

/* ================= STATE ================= */
onAuthStateChanged(auth, async user => {
  logoImg.src = FASTMOST_LOGO_URL;

  if(!user){
    authBox.style.display="flex";
    appBox.style.display="none";
    return;
  }

  if(!user.emailVerified){
    alert("Подтвердите email и обновите страницу");
    return;
  }

  authBox.style.display="none";
  appBox.style.display="flex";
  userEmail.innerText = user.email;

  const snap = await getDoc(doc(db,"users",user.uid));
  avatarImg.src = snap.exists()
    ? snap.data().avatar
    : gravatar(user.email);
});
</script>

<style>
body{
  margin:0;
  background:#0b0e14;
  color:white;
  font-family:Inter,Segoe UI,Arial;
}
.center{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  background:#141827;
  padding:32px;
  border-radius:18px;
  width:100%;
  max-width:380px;
  text-align:center;
}
.logo{width:64px;margin-bottom:6px}
.brand{font-size:28px;font-weight:900;color:#6b7cff}
input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:12px;
  border:1px solid #242a45;
  background:#0f1324;
  color:white;
}
button{
  width:100%;
  padding:14px;
  margin-top:14px;
  border:none;
  border-radius:12px;
  background:#6b7cff;
  color:white;
}
.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  margin:10px auto;
  border:2px solid #6b7cff;
}
</style>
</head>

<body>

<div id="authBox" class="center">
  <div class="card">
    <img id="logoImg" class="logo">
    <div class="brand">FASTMOST</div>
    <input id="emailInput" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Пароль">
    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>
  </div>
</div>

<div id="appBox" class="center" style="display:none">
  <div class="card">
    <img id="logoImg" class="logo">
    <div class="brand">FASTMOST</div>

    <img id="avatarImg" class="avatar">
    <input id="avatarUrl" placeholder="Ссылка на аватар">
    <button onclick="saveAvatar()">Сохранить аватар</button>

    <p id="userEmail"></p>
    <button onclick="logout()">Выйти</button>
  </div>
</div>

</body>
</html>
