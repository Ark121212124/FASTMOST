<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://meet.jit.si/external_api.js"></script>

<style>
:root{
  --bg:#0b0e14;
  --panel:#141827cc;
  --panel-solid:#141827;
  --accent:#5865f2;
  --accent2:#3ba55d;
  --text:#e6e8f0;
  --muted:#8b90b3;
  --radius:16px;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  background:radial-gradient(circle at top,#1b1f3b,#0b0e14);
  font-family:Inter,system-ui;
  color:var(--text);
}

/* ===== LAYOUT ===== */
#app{
  display:flex;
  height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:280px;
  background:var(--panel);
  backdrop-filter:blur(18px);
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:30px;
  overflow:auto;
}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(135deg,#5865f2,#3b45a5);
  border-radius:24px;
  padding:40px;
  margin-bottom:30px;
}
.hero h1{
  margin:0;
  font-size:34px;
}
.hero p{
  opacity:.85;
  margin:10px 0 0;
}

/* ===== ROOM GRID ===== */
.section-title{
  font-size:18px;
  margin-bottom:12px;
}

.rooms{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}

.room{
  background:var(--panel);
  backdrop-filter:blur(16px);
  padding:18px;
  border-radius:18px;
  cursor:pointer;
  transition:.25s;
}
.room:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 40px rgba(0,0,0,.4);
}

.room .type{
  font-size:13px;
  color:var(--muted);
}
.room .name{
  font-size:18px;
  margin-top:6px;
}

/* ===== BUTTON ===== */
button{
  padding:14px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-content{
  background:var(--panel-solid);
  padding:30px;
  border-radius:20px;
  width:420px;
}
.modal input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:12px;
  border:none;
  background:#0f1324;
  color:white;
}
</style>
</head>

<body>

<div id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">FASTMOST</div>
    <button onclick="openModal()">➕ Создать комнату</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="hero">
      <h1>Добро пожаловать в FASTMOST</h1>
      <p>Создавай голосовые и текстовые комнаты. Общайся мгновенно.</p>
    </div>

    <div class="section-title">🔊 Voice комнаты</div>
    <div class="rooms" id="voiceRooms"></div>

    <br>

    <div class="section-title">💬 Текстовые комнаты</div>
    <div class="rooms" id="textRooms"></div>

  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Создать комнату</h3>
    <input id="roomName" placeholder="Название">
    <select id="roomType" style="width:100%;padding:14px;border-radius:12px;border:none">
      <option value="voice">Голосовая</option>
      <option value="text">Текстовая</option>
    </select>
    <br><br>
    <button onclick="createRoom()">Создать</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain:"fastmost-f8084.firebaseapp.com",
  projectId:"fastmost-f8084"
});
const db = getFirestore(app);

window.openModal=()=>modal.style.display="flex";
modal.onclick=e=>{if(e.target===modal)modal.style.display="none"};

window.createRoom=async()=>{
  if(!roomName.value)return;
  await addDoc(collection(db,"rooms"),{
    name:roomName.value,
    type:roomType.value
  });
  modal.style.display="none";
  roomName.value="";
};

onSnapshot(collection(db,"rooms"),snap=>{
  voiceRooms.innerHTML="";
  textRooms.innerHTML="";
  snap.forEach(d=>{
    const r=d.data();
    const el=document.createElement("div");
    el.className="room";
    el.innerHTML=`
      <div class="type">${r.type==="voice"?"🔊 Voice":"💬 Text"}</div>
      <div class="name">${r.name}</div>`;
    el.onclick=()=>{
      if(r.type==="voice"){
        location.href=`voice.html?room=${d.id}`;
      }else{
        location.href=`chat.html?room=${d.id}`;
      }
    };
    (r.type==="voice"?voiceRooms:textRooms).appendChild(el);
  });
});
</script>

</body>
</html>
