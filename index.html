<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Voice Space</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://meet.jit.si/external_api.js"></script>

<style>
:root {
    --bg-main: #0f1115;
    --bg-sidebar: #16181d;
    --bg-panel: #1e2128;
    --accent: #5865f2;
    --text-main: #ffffff;
    --text-muted: #b5bac1;
    --border: #2b2f36;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: var(--bg-main);
    color: var(--text-main);
    height: 100vh;
    display: flex;
}

/* SIDEBAR */
.sidebar {
    width: 240px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}

.logo {
    padding: 20px;
    font-size: 20px;
    font-weight: bold;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
}

.rooms {
    padding: 15px;
}

.room {
    padding: 12px;
    margin-bottom: 10px;
    background: var(--bg-panel);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

.room:hover {
    background: var(--accent);
}

/* MAIN */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    height: 60px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-weight: 600;
}

#jitsi {
    flex: 1;
}

/* MOBILE */
@media (max-width: 768px) {
    .sidebar {
        width: 70px;
    }
    .room {
        text-align: center;
        font-size: 12px;
    }
    .logo {
        font-size: 14px;
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="sidebar">
    <div class="logo">🎧 Voice</div>
    <div class="rooms">
        <div class="room" onclick="joinRoom('room-main')">Общий</div>
        <div class="room" onclick="joinRoom('room-gaming')">Игры</div>
        <div class="room" onclick="joinRoom('room-chill')">Чилл</div>
    </div>
</div>

<div class="main">
    <div class="header">Голосовая комната</div>
    <div id="jitsi"></div>
</div>

<script>
let api = null;

function joinRoom(roomName) {
    if (api) api.dispose();

    api = new JitsiMeetExternalAPI("meet.jit.si", {
        roomName: roomName,
        parentNode: document.querySelector("#jitsi"),
        width: "100%",
        height: "100%",
        configOverwrite: {
            startWithAudioMuted: false,
            startWithVideoMuted: true
        },
        interfaceConfigOverwrite: {
            DEFAULT_BACKGROUND: "#0f1115"
        }
    });
}

// стартовая комната
joinRoom("room-main");
</script>

</body>
</html>
