<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTMOST</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
:root{
  --accent:#5865f2;
  --bg:#070b16;
  --panel:rgba(20,25,45,.75);
  --text:#e6e9ff;
  --blur:blur(14px);
}

*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  font-family:Inter,system-ui;
  background:
    radial-gradient(1200px 600px at top,var(--accent)15%,transparent),
    var(--bg);
  color:var(--text);
}

/* ===== LAYOUT ===== */
.app{
  display:grid;
  grid-template-columns:240px 1fr;
  height:100vh;
}

/* ===== SIDEBAR ===== */
.sidebar{
  padding:20px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  display:flex;
  flex-direction:column;
  gap:14px;
}

.sidebar h2{
  margin:0 0 10px;
}

.sidebar button{
  background:#1e2345;
  border:none;
  color:#fff;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

/* ===== MAIN ===== */
.main{
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.hero{
  padding:24px;
  border-radius:18px;
  background:linear-gradient(135deg,#5865f2,#7b7fff);
}

.rooms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.panel{
  background:var(--panel);
  backdrop-filter:var(--blur);
  border-radius:18px;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.panel input{
  background:#0f1430;
  border:none;
  padding:10px;
  border-radius:10px;
  color:#fff;
}

.panel button{
  background:var(--accent);
  border:none;
  padding:10px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}

.list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.room{
  padding:10px;
  border-radius:10px;
  background:#141a3a;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>FASTMOST</h2>
    <button onclick="location.href='index.html'">🏠 Главная</button>
    <button onclick="location.href='profile.html'">👤 Профиль</button>
    <button onclick="location.href='admin.html'">🛠 Админка</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <div class="hero">
      <h1>FASTMOST</h1>
      <p>Голосовые и текстовые комнаты нового поколения</p>
    </div>

    <div class="rooms">

      <!-- TEXT ROOMS -->
      <div class="panel">
        <h3>💬 Текстовые комнаты</h3>
        <input id="textName" placeholder="Название комнаты">
        <button onclick="createTextRoom()">Создать</button>
        <div id="textRooms" class="list"></div>
      </div>

      <!-- VOICE ROOMS -->
      <div class="panel">
        <h3>🎧 Voice-комнаты</h3>
        <input id="voiceName" placeholder="Название комнаты">
        <button onclick="createVoiceRoom()">Создать</button>
        <div id="voiceRooms" class="list"></div>
      </div>

    </div>

  </main>
</div>

<script>
/* ===== FIREBASE ===== */
firebase.initializeApp({
  apiKey: "ВАШ_API_KEY",
  authDomain: "fastmost-8084.firebaseapp.com",
  projectId: "fastmost-8084"
});
const db = firebase.firestore();

/* ===== CREATE ROOMS ===== */
function createTextRoom(){
  const name=document.getElementById("textName").value.trim();
  if(!name) return;
  db.collection("rooms").add({name,type:"text"});
}

function createVoiceRoom(){
  const name=document.getElementById("voiceName").value.trim();
  if(!name) return;
  db.collection("rooms").add({name,type:"voice"});
}

/* ===== LOAD ROOMS ===== */
db.collection("rooms").onSnapshot(s=>{
  textRooms.innerHTML="";
  voiceRooms.innerHTML="";
  s.forEach(d=>{
    const r=d.data();
    const el=document.createElement("div");
    el.className="room";
    el.textContent="# "+r.name;
    el.onclick=()=>location.href=
      r.type==="text"
        ?`chat.html?room=${d.id}`
        :`voice.html?room=${d.id}`;
    (r.type==="text"?textRooms:voiceRooms).appendChild(el);
  });
});
</script>

</body>
</html>
