<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>FASTMOST</h1>

<input id="roomName" placeholder="Название комнаты">
<button id="createRoom">Создать</button>

<div id="roomList"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, onSnapshot } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const roomsRef = collection(db,"rooms");

createRoom.onclick = async ()=>{
  if(!roomName.value) return;
  await addDoc(roomsRef,{ name:roomName.value });
  roomName.value="";
};

onSnapshot(roomsRef,snap=>{
  roomList.innerHTML="";
  snap.forEach(d=>{
    const a=document.createElement("a");
    a.href=`chat.html?room=${d.id}`;
    a.textContent=d.data().name;
    roomList.appendChild(a);
  });
});
</script>

</body>
</html>
