<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FASTMOST</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#12183a;
  --panel-2:#161d4f;
  --accent:#5865f2;
  --text:#ffffff;
  --muted:#9aa0d4;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:Inter,Arial,sans-serif;
  background:radial-gradient(1200px 600px at top,var(--panel-2),var(--bg));
  color:var(--text);
}

.app{
  display:flex;
  height:100vh;
}

/* sidebar */
.sidebar{
  width:220px;
  background:rgba(10,14,35,.9);
  padding:16px;
}

.sidebar h2{
  margin:0 0 20px;
}

.nav button{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,.06);
  color:white;
  cursor:pointer;
}

/* main */
.main{
  flex:1;
  padding:24px;
  overflow:auto;
}

.header{
  background:linear-gradient(135deg,#5865f2,#7b83ff);
  border-radius:18px;
  padding:24px;
  margin-bottom:20px;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.card{
  background:rgba(255,255,255,.06);
  border-radius:16px;
  padding:16px;
}

.card h3{
  margin-top:0;
}

.input-row{
  display:flex;
  gap:10px;
}

.input-row input{
  flex:1;
  padding:10px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,.08);
  color:white;
}

.input-row button{
  padding:10px 16px;
  border-radius:10px;
  border:none;
  background:var(--accent);
  color:white;
  cursor:pointer;
}

.list{
  margin-top:14px;
}

.room{
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
  margin-bottom:8px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <h2>FASTMOST</h2>
    <div class="nav">
      <button>🏠 Главная</button>
      <button>👤 Профиль</button>
      <button>🛠 Админка</button>
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <h1>FASTMOST</h1>
      <p>Голосовые и текстовые комнаты нового поколения</p>
    </div>

    <div class="cards">

      <!-- TEXT -->
      <div class="card">
        <h3>💬 Текстовые комнаты</h3>
        <div class="input-row">
          <input id="textName" placeholder="Название комнаты"/>
          <button onclick="createText()">Создать</button>
        </div>
        <div id="textRooms" class="list"></div>
      </div>

      <!-- VOICE -->
      <div class="card">
        <h3>🎧 Voice-комнаты</h3>
        <div class="input-row">
          <input id="voiceName" placeholder="Название комнаты"/>
          <button onclick="createVoice()">Создать</button>
        </div>
        <div id="voiceRooms" class="list"></div>
      </div>

    </div>
  </main>

</div>

<script>
function createText(){
  const name=document.getElementById('textName').value.trim();
  if(!name)return;
  const div=document.createElement('div');
  div.className='room';
  div.textContent='# '+name;
  div.onclick=()=>location.href='chat.html?room='+encodeURIComponent(name);
  document.getElementById('textRooms').appendChild(div);
  document.getElementById('textName').value='';
}

function createVoice(){
  const name=document.getElementById('voiceName').value.trim();
  if(!name)return;
  const div=document.createElement('div');
  div.className='room';
  div.textContent='🔊 '+name;
  document.getElementById('voiceRooms').appendChild(div);
  document.getElementById('voiceName').value='';
}
</script>

</body>
</html>
