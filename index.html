<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  background:#0b1020;
  font-family:Arial;
  color:#fff;
}
.wrapper {
  padding:30px;
}
.box {
  background:#141a33;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}
input, button {
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
}
button {
  background:#5865f2;
  color:white;
  cursor:pointer;
  margin-top:10px;
}
.room {
  margin-top:10px;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="wrapper">

<h1>FASTMOST</h1>

<div class="box">
<h3>Текстовая комната</h3>
<input id="textName" placeholder="Название">
<button onclick="createRoom('chat')">Создать</button>
<div id="chatRooms"></div>
</div>

<div class="box">
<h3>Voice комната</h3>
<input id="voiceName" placeholder="Название">
<button onclick="createRoom('voice')">Создать</button>
<div id="voiceRooms"></div>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function createRoom(type) {
  const name = type === 'chat'
    ? textName.value
    : voiceName.value;

  if(!name) return alert("Введите название");

  db.collection("rooms").add({
    name,
    type,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
}

db.collection("rooms").onSnapshot(snap=>{
  chatRooms.innerHTML = "";
  voiceRooms.innerHTML = "";

  snap.forEach(doc=>{
    const r = doc.data();
    const div = document.createElement("div");
    div.className = "room";
    div.textContent = "# " + r.name;

    if(r.type === "chat"){
      div.onclick = ()=>location.href=`chat.html?room=${doc.id}`;
      chatRooms.appendChild(div);
    } else {
      div.onclick = ()=>location.href=`voice.html?room=${doc.id}`;
      voiceRooms.appendChild(div);
    }
  });
});
</script>
</body>
</html>
