<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://meet.jit.si/external_api.js"></script>

<style>
:root {
  --bg: #0b0d12;
  --panel: #151822;
  --accent: #5865f2;
  --text: #ffffff;
  --muted: #9aa1b2;
  --border: #23273a;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", Arial, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
}

/* ===== LOGIN ===== */
#login {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: var(--panel);
  padding: 40px;
  border-radius: 12px;
  width: 320px;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,0,0,.4);
}

.brand {
  font-size: 28px;
  font-weight: bold;
  color: var(--accent);
  margin-bottom: 10px;
}

.login-box input {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border-radius: 8px;
  border: none;
  outline: none;
  background: #0f1220;
  color: white;
}

.login-box button {
  margin-top: 20px;
  width: 100%;
  padding: 12px;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

/* ===== APP ===== */
#app {
  display: none;
  height: 100vh;
}

.sidebar {
  width: 260px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 20px;
}

.sidebar h2 {
  margin: 0 0 20px;
  color: var(--accent);
}

.sidebar input,
.sidebar button {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.sidebar input {
  background: #0f1220;
  color: white;
}

.sidebar button {
  background: var(--accent);
  color: white;
  cursor: pointer;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 15px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
}

#jitsi {
  flex: 1;
}

.wrapper {
  display: flex;
  height: 100%;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="brand">FASTMOST</div>
    <p class="muted">Голос и чат</p>
    <input id="nickname" placeholder="Введите никнейм">
    <button onclick="enter()">Войти</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="wrapper">
    <div class="sidebar">
      <h2>FASTMOST</h2>
      <input id="room" placeholder="Код комнаты">
      <button onclick="join()">Войти в комнату</button>
      <button onclick="create()">Создать комнату</button>
    </div>

    <div class="main">
      <div class="header" id="roomTitle">Комната</div>
      <div id="jitsi"></div>
    </div>
  </div>
</div>

<script>
let api;
let username;

function enter() {
  username = document.getElementById("nickname").value.trim();
  if (!username) return alert("Введите ник");

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
}

function create() {
  const room = "fastmost-" + Math.random().toString(36).substring(2,8);
  joinRoom(room);
}

function join() {
  const room = document.getElementById("room").value.trim();
  if (!room) return alert("Введите код комнаты");
  joinRoom(room);
}

function joinRoom(room) {
  document.getElementById("roomTitle").innerText = "Комната: " + room;

  if (api) api.dispose();

  api = new JitsiMeetExternalAPI("meet.jit.si", {
    roomName: room,
    parentNode: document.getElementById("jitsi"),
    userInfo: { displayName: username },
    configOverwrite: {
      startWithAudioMuted: false,
      startWithVideoMuted: true
    }
  });
}
</script>

</body>
</html>
