<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5865f2">

<style>
:root{
  --bg:#0b0e14;
  --panel:#141827cc;
  --panel-solid:#141827;
  --accent:#5865f2;
  --accent2:#3ba55d;
  --text:#e6e8f0;
  --muted:#8b90b3;
  --radius:18px;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  background:
    radial-gradient(circle at top,#1b1f3b,#0b0e14);
  font-family:Inter,system-ui;
  color:var(--text);
}

/* ===== APP LAYOUT ===== */
#app{
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* ===== SIDEBAR ===== */
.sidebar{
  width:280px;
  background:var(--panel);
  backdrop-filter:blur(18px);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:1px;
}

.create-btn{
  background:var(--accent);
  border:none;
  padding:14px;
  border-radius:14px;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
.create-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 30px rgba(88,101,242,.4);
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:32px;
  overflow-y:auto;
}

/* ===== HERO ===== */
.hero{
  background:linear-gradient(135deg,#5865f2,#3b45a5);
  border-radius:26px;
  padding:40px;
  margin-bottom:32px;
}
.hero h1{
  margin:0;
  font-size:34px;
}
.hero p{
  margin-top:10px;
  opacity:.9;
}

/* ===== SECTIONS ===== */
.section{
  margin-bottom:40px;
}
.section-title{
  font-size:18px;
  margin-bottom:14px;
}

/* ===== ROOM GRID ===== */
.rooms{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:18px;
}

.room{
  background:var(--panel);
  backdrop-filter:blur(16px);
  border-radius:20px;
  padding:20px;
  cursor:pointer;
  transition:.25s;
  position:relative;
  overflow:hidden;
}
.room::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,.08),transparent);
  opacity:0;
  transition:.25s;
}
.room:hover::after{opacity:1}
.room:hover{
  transform:translateY(-6px);
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.room .type{
  font-size:13px;
  color:var(--muted);
}
.room .name{
  font-size:20px;
  margin-top:8px;
}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.modal-content{
  background:var(--panel-solid);
  padding:30px;
  border-radius:24px;
  width:420px;
}
.modal h3{
  margin-top:0;
}
.modal input, .modal select{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:14px;
  border:none;
  background:#0f1324;
  color:white;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{
  background:#2a2f55;
  border-radius:10px;
}
</style>
</head>

<body>

<div id="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">FASTMOST</div>
    <button class="create-btn" onclick="openModal()">➕ Создать комнату</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HERO -->
    <div class="hero">
      <h1>Добро пожаловать в FASTMOST</h1>
      <p>Голосовые и текстовые комнаты нового поколения</p>
    </div>

    <!-- VOICE -->
    <div class="section">
      <div class="section-title">🔊 Voice комнаты</div>
      <div class="rooms" id="voiceRooms"></div>
    </div>

    <!-- CHAT -->
    <div class="section">
      <div class="section-title">💬 Текстовые комнаты</div>
      <div class="rooms" id="textRooms"></div>
    </div>

  </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3>Создать комнату</h3>
    <input id="roomName" placeholder="Название комнаты">
    <select id="roomType">
      <option value="voice">Голосовая</option>
      <option value="text">Текстовая</option>
    </select>
    <br><br>
    <button class="create-btn" onclick="createRoom()">Создать</button>
  </div>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain:"fastmost-f8084.firebaseapp.com",
  projectId:"fastmost-f8084"
});
const db = getFirestore(app);

const modal = document.getElementById("modal");

window.openModal = () => modal.style.display="flex";
modal.onclick = e => { if(e.target===modal) modal.style.display="none"; };

window.createRoom = async () => {
  if(!roomName.value) return;
  await addDoc(collection(db,"rooms"),{
    name:roomName.value,
    type:roomType.value
  });
  modal.style.display="none";
  roomName.value="";
};

onSnapshot(collection(db,"rooms"),snap=>{
  voiceRooms.innerHTML="";
  textRooms.innerHTML="";
  snap.forEach(d=>{
    const r=d.data();
    const el=document.createElement("div");
    el.className="room";
    el.innerHTML=`
      <div class="type">${r.type==="voice"?"🔊 Voice":"💬 Text"}</div>
      <div class="name">${r.name}</div>`;
    el.onclick=()=>{
      location.href = r.type==="voice"
        ? `voice.html?room=${d.id}`
        : `chat.html?room=${d.id}`;
    };
    (r.type==="voice"?voiceRooms:textRooms).appendChild(el);
  });
});
</script>

<!-- SERVICE WORKER -->
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
