<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FASTMOST • Админ</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ========== THEMES ========== */
body[data-theme="purple"]{--accent:#5865f2;--bg:#070b16}
body[data-theme="cyber"]{--accent:#00ffe1;--bg:#020d0c}
body[data-theme="red"]{--accent:#ff3b3b;--bg:#120405}

:root{
  --panel:rgba(20,25,45,.65);
  --text:#e6e9ff;
  --blur:blur(16px);
}

*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  font-family:Inter,system-ui;
  background:
    radial-gradient(1200px 600px at top,var(--accent)12%,transparent),
    var(--bg);
  color:var(--text);
  display:flex;
}

/* ========== SIDEBAR ========== */
aside{
  width:260px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.logo{
  font-size:20px;
  font-weight:700;
  color:var(--accent);
}

aside button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  color:var(--text);
  cursor:pointer;
}
aside button:hover{background:rgba(255,255,255,.1)}

.themeBtn{
  margin-top:auto;
  background:var(--accent);
  color:#fff;
}

/* ========== MAIN ========== */
main{
  flex:1;
  padding:24px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* ========== STATS ========== */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.stat{
  background:var(--panel);
  backdrop-filter:var(--blur);
  border-radius:18px;
  padding:18px;
}

.stat h2{
  margin:0;
  font-size:28px;
}

.stat span{
  opacity:.7;
  font-size:14px;
}

/* ========== ROOMS ========== */
.panel{
  background:var(--panel);
  backdrop-filter:var(--blur);
  border-radius:18px;
  padding:16px;
}

.room{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  margin-bottom:8px;
}

.room small{opacity:.6}

.room button{
  background:#ff3b3b;
  border:none;
  color:#fff;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body data-theme="purple">

<!-- SIDEBAR -->
<aside>
  <div class="logo">FASTMOST</div>
  <button onclick="location.href='index.html'">🏠 Главная</button>
  <button onclick="location.href='chat.html'">💬 Чаты</button>
  <button onclick="logout()">🚪 Выйти</button>
  <button class="themeBtn" onclick="switchTheme()">🎨 Сменить тему</button>
</aside>

<!-- MAIN -->
<main>

  <h1>Админ-панель</h1>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <h2 id="usersCount">0</h2>
      <span>Пользователей</span>
    </div>
    <div class="stat">
      <h2 id="roomsCount">0</h2>
      <span>Комнат</span>
    </div>
    <div class="stat">
      <h2 id="voiceCount">0</h2>
      <span>Voice-комнат</span>
    </div>
  </div>

  <!-- ROOMS -->
  <div class="panel">
    <h3>Все комнаты</h3>
    <div id="rooms"></div>
  </div>

</main>

<script>
/* ========== FIREBASE ========== */
firebase.initializeApp({
  // 🔥 ВСТАВЬ СВОЙ FIREBASE CONFIG
});

const auth = firebase.auth();
const db = firebase.firestore();

/* ========== AUTH CHECK ========== */
auth.onAuthStateChanged(async user=>{
  if(!user){location.href="login.html";return;}

  const snap = await db.collection("users").doc(user.uid).get();
  if(!snap.exists || snap.data().role!=="admin"){
    alert("Нет доступа");
    location.href="index.html";
  }
});

/* ========== STATS ========== */
db.collection("users").onSnapshot(s=>{
  usersCount.innerText = s.size;
});

db.collection("rooms").onSnapshot(s=>{
  roomsCount.innerText = s.size;
  voiceCount.innerText = s.docs.filter(d=>d.data().type==="voice").length;

  rooms.innerHTML="";
  s.forEach(d=>{
    const r=d.data();
    const div=document.createElement("div");
    div.className="room";
    div.innerHTML=`
      <div>
        <b>${r.name}</b>
        <small>${r.type}</small>
      </div>
      <button onclick="del('${d.id}')">Удалить</button>
    `;
    rooms.appendChild(div);
  });
});

/* ========== DELETE ROOM ========== */
function del(id){
  if(confirm("Удалить комнату?")){
    db.collection("rooms").doc(id).delete();
  }
}

/* ========== LOGOUT ========== */
function logout(){
  auth.signOut().then(()=>location.href="login.html");
}

/* ========== THEME ========== */
const themes=["purple","cyber","red"];
let t=0;
function switchTheme(){
  t=(t+1)%themes.length;
  document.body.dataset.theme=themes[t];
}
</script>

</body>
</html>
