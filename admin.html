<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin • FASTMOST</title>
<style>
body{
  margin:0;
  background:#0b0e14;
  color:white;
  font-family:Inter;
}
header{
  padding:20px;
  background:#141827;
  display:flex;
  justify-content:space-between;
}
section{padding:20px}
.card{
  background:#141827;
  padding:16px;
  border-radius:14px;
  margin-bottom:14px;
}
button{
  background:#e74c3c;
  border:none;
  padding:6px 12px;
  border-radius:8px;
  color:white;
}
</style>
</head>
<body>

<header>
  <b>🛠 Админ-панель</b>
  <button onclick="location.href='index.html'">Назад</button>
</header>

<section>
  <div class="card">
    <h3>📊 Статистика</h3>
    <div id="stats"></div>
  </div>

  <div class="card">
    <h3>🧹 Комнаты</h3>
    <div id="rooms"></div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore,collection,onSnapshot,deleteDoc,doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  projectId:"fastmost-f8084"
});
const db=getFirestore();

onSnapshot(collection(db,"users"),s=>{
  stats.innerText="Пользователей: "+s.size;
});

onSnapshot(collection(db,"rooms"),snap=>{
  rooms.innerHTML="";
  snap.forEach(d=>{
    const div=document.createElement("div");
    div.innerHTML=`${d.data().name} <button onclick="del('${d.id}')">Удалить</button>`;
    rooms.appendChild(div);
  });
});

window.del=async(id)=>{
  if(confirm("Удалить комнату?")){
    await deleteDoc(doc(db,"rooms",id));
  }
};
</script>

</body>
</html>
