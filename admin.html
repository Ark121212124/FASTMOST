<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0b0e14;
  color:white;
  font-family:Inter,system-ui;
}
header{
  height:60px;
  background:#141827;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}
section{
  padding:20px;
}
.card{
  background:#151a2e;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
}
button{
  background:#f04747;
  border:none;
  color:white;
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <b>🛡 FASTMOST Admin</b>
  <button onclick="location.href='index.html'">Выйти</button>
</header>

<section>

<div class="card">
  <h3>📊 Статистика</h3>
  <p id="stats">Загрузка...</p>
</div>

<div class="card">
  <h3>👥 Пользователи онлайн</h3>
  <ul id="users"></ul>
</div>

</section>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getFirestore, collection, getDocs }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// USERS
const usersSnap = await getDocs(collection(db,"users"));
document.getElementById("stats").innerText =
`Всего пользователей: ${usersSnap.size}`;

usersSnap.forEach(doc=>{
  const u = doc.data();
  const li = document.createElement("li");
  li.textContent = `${u.name || "User"} (${u.role})`;
  document.getElementById("users").appendChild(li);
});
</script>

</body>
</html>
