<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Admin • FASTMOST</title>
<meta name="viewport" content="width=device-width">
<style>
body{
  margin:0;
  font-family:Inter;
  background:#0b0e14;
  color:white;
}
header{
  padding:20px;
  background:#11162a;
  display:flex;
  justify-content:space-between;
}
section{padding:20px}
.card{
  background:#11162a;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}
button{
  background:#e74c3c;
  border:none;
  padding:6px 10px;
  border-radius:8px;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <b>🛠 Админ-панель</b>
  <button onclick="location.href='index.html'">Назад</button>
</header>

<section>
  <div class="card">
    <h3>📊 Статистика</h3>
    <div id="stats"></div>
  </div>

  <div class="card">
    <h3>🧹 Комнаты</h3>
    <div id="rooms"></div>
  </div>
</section>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth,onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,collection,onSnapshot,doc,deleteDoc
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain:"fastmost-f8084.firebaseapp.com",
  projectId:"fastmost-f8084"
});
const auth=getAuth();
const db=getFirestore();

onAuthStateChanged(auth,async user=>{
  if(!user) location.href="index.html";
});

onSnapshot(collection(db,"users"),snap=>{
  stats.innerHTML=`👥 Пользователей: ${snap.size}`;
});

onSnapshot(collection(db,"rooms"),snap=>{
  rooms.innerHTML="";
  snap.forEach(d=>{
    const div=document.createElement("div");
    div.innerHTML=`# ${d.data().name}
      <button onclick="del('${d.id}')">Удалить</button>`;
    rooms.appendChild(div);
  });
});

window.del=async(id)=>{
  if(confirm("Удалить комнату?")){
    await deleteDoc(doc(db,"rooms",id));
  }
};
</script>

</body>
</html>
