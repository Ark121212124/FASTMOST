<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>FASTMOST Admin</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  projectId:"fastmost-f8084"
});
const db = getFirestore(app);

onSnapshot(collection(db,"rooms"),snap=>{
  list.innerHTML="";
  snap.forEach(d=>{
    list.innerHTML+=`
      <div>
        ${d.data().name}
        <button onclick="del('${d.id}')">Удалить</button>
      </div>`;
  });
});

window.del=async(id)=>{
  await deleteDoc(doc(db,"rooms",id));
};
</script>
</head>
<body style="background:#0b0e14;color:white;font-family:Inter">
<h2>Админ FASTMOST</h2>
<div id="list"></div>
</body>
</html>
