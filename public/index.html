<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FASTMOST</title>

  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/logo.svg">

  <script>
    if (!localStorage.getItem("token")) {
      location.href = "/onboarding.html";
    }
  </script>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="server">
      <img src="/logo.svg" width="36">
    </div>
  </aside>

  <!-- CHANNELS -->
  <aside class="channels">
    <div class="channels-title">ТЕКСТ</div>
    <div id="textChannels"></div>

    <div class="channels-title">ГОЛОС</div>
    <div id="voiceChannels"></div>

    <button class="add-channel" onclick="createChannel()">＋ канал</button>
  </aside>

  <!-- CHAT -->
  <main class="chat-area">
    <header class="chat-header">
      <span id="channelName"># общий</span>
      <span id="online" class="online">🟢 Онлайн: 1</span>
    </header>

    <div id="messages" class="messages"></div>

    <div class="chat-input">
      <input id="msg" placeholder="Сообщение">
      <button onclick="send()">➤</button>
    </div>
  </main>

</div>

<script src="/script.js"></script>
<script src="/voice.js"></script>
</body>
</html>
