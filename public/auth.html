<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FASTMOST — Вход</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="auth-box">
  <img src="/logo.svg" width="140">

  <input id="u" placeholder="Логин">
  <input id="p" type="password" placeholder="Пароль">

  <button class="primary" onclick="go('login')">Войти</button>
  <button onclick="go('register')">Регистрация</button>
</div>

<script>
const u = document.getElementById("u");
const p = document.getElementById("p");

async function go(type) {
  if (!u.value || !p.value) {
    alert("Введите логин и пароль");
    return;
  }

  const r = await fetch("/" + type, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: u.value,
      password: p.value
    })
  });

  if (!r.ok) {
    alert("Ошибка авторизации");
    return;
  }

  const d = await r.json();
  localStorage.setItem("token", d.token);
  localStorage.setItem("username", d.username);
  location.href = "/";
}
</script>

</body>
</html>
