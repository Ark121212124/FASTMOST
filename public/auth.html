<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="style.css">
<title>FASTMOST — Вход</title>
</head>
<body>

<div class="auth-box">
  <img src="/logo.svg" width="140">
  <input id="u" placeholder="Логин">
  <input id="p" type="password" placeholder="Пароль">

  <button class="primary" onclick="go('login')">Войти</button>
  <button onclick="go('register')">Регистрация</button>
</div>

<script>
async function go(type) {
  const r = await fetch("/" + type, {
    method: "POST",
    body: JSON.stringify({
      username: u.value,
      password: p.value
    })
  });

  if (!r.ok) return alert("Ошибка");

  const d = await r.json();
  localStorage.setItem("token", d.token);
  localStorage.setItem("username", d.username);
  location.href = "/";
}
</script>

</body>
</html>
