<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Voice Lobby</title>
<style>
body{
  margin:0;
  font-family:Inter;
  background:#0b0e14;
  color:white;
}
.list{
  padding:20px;
}
.room{
  background:#11162a;
  padding:16px;
  border-radius:14px;
  margin-bottom:10px;
  cursor:pointer;
}
.room:hover{background:#1a2040}
</style>
</head>
<body>

<div class="list" id="list"></div>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore,collection,onSnapshot }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  projectId:"fastmost-f8084"
});
const db=getFirestore();

onSnapshot(collection(db,"rooms"),snap=>{
  list.innerHTML="";
  snap.forEach(d=>{
    const div=document.createElement("div");
    div.className="room";
    div.innerText="🎙 "+d.data().name;
    div.onclick=()=>location.href=`voice.html?room=${d.id}`;
    list.appendChild(div);
  });
});
</script>

</body>
</html>
