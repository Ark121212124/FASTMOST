<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Voice Lobby</title>
<style>
body{
  margin:0;
  background:#0b0e14;
  font-family:Inter;
  color:white;
}
.list{
  padding:30px;
}
.room{
  background:#141827;
  padding:18px;
  border-radius:18px;
  margin-bottom:12px;
  cursor:pointer;
}
.room:hover{background:#1f2547}
</style>
</head>
<body>

<div class="list" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore,collection,onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  projectId:"fastmost-f8084"
});
const db=getFirestore();

onSnapshot(collection(db,"rooms"),snap=>{
  list.innerHTML="";
  snap.forEach(d=>{
    const el=document.createElement("div");
    el.className="room";
    el.innerText="🎙 "+d.data().name;
    el.onclick=()=>location.href=`voice.html?room=${d.id}`;
    list.appendChild(el);
  });
});
</script>

</body>
</html>
