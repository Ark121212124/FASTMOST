<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5865F2">

<style>
:root {
  --bg:#0b1022;
  --panel:#11183a;
  --accent:#5865F2;
}

body {
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(135deg,#0b1022,#10173a);
  font-family:Inter,system-ui;
  color:#fff;
}

header {
  padding:14px;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(12px);
  display:flex;
  gap:10px;
  align-items:center;
}

header button {
  background:var(--accent);
  border:none;
  padding:8px 14px;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.msg {
  display:flex;
  gap:12px;
  margin-bottom:16px;
  animation:fade .25s ease;
}

@keyframes fade {
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1}
}

.avatar {
  width:44px;
  height:44px;
  border-radius:50%;
}

.msg-content {
  background:rgba(255,255,255,.06);
  border-radius:14px;
  padding:12px 14px;
  max-width:70%;
  position:relative;
}

.msg-content:hover .actions {
  opacity:1;
}

.msg-content b {
  font-size:14px;
}

.msg-content time {
  font-size:11px;
  opacity:.5;
  margin-left:6px;
}

.actions {
  position:absolute;
  top:6px;
  right:10px;
  opacity:0;
  transition:.2s;
  cursor:pointer;
}

.reactions span {
  cursor:pointer;
  margin-right:6px;
}

.gif {
  max-width:260px;
  border-radius:10px;
}

footer {
  padding:14px;
  background:rgba(0,0,0,.4);
  display:flex;
  gap:8px;
}

footer input {
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
}

footer button {
  background:var(--accent);
  border:none;
  padding:12px;
  border-radius:12px;
  color:#fff;
  cursor:pointer;
}

/* GIF PANEL */
#gifPanel {
  position:absolute;
  bottom:80px;
  left:20px;
  right:20px;
  background:#0f1433;
  border-radius:14px;
  padding:12px;
  display:none;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

#gifPanel input {
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  margin-bottom:10px;
}

.gif-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  max-height:260px;
  overflow:auto;
}

.gif-grid img {
  width:100%;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.gif-grid img:hover {
  transform:scale(1.05);
}
</style>
</head>

<body>

<header>
  <button onclick="history.back()">←</button>
  <b>FASTMOST Chat</b>
</header>

<div id="messages"></div>

<div id="gifPanel">
  <input id="gifSearch" placeholder="Поиск GIF..." oninput="searchGif()">
  <div class="gif-grid" id="gifGrid"></div>
</div>

<footer>
  <button onclick="toggleGif()">GIF</button>
  <input id="text" placeholder="Сообщение...">
  <button onclick="send()">➤</button>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"ВСТАВЬ",
  authDomain:"ВСТАВЬ",
  projectId:"ВСТАВЬ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const room = new URLSearchParams(location.search).get("room");
const ref = collection(db,"rooms",room,"messages");
const q = query(ref,orderBy("createdAt"));

const box = document.getElementById("messages");

onSnapshot(q,s=>{
  box.innerHTML="";
  s.forEach(d=>{
    const m=d.data();
    box.innerHTML+=`
    <div class="msg">
      <img class="avatar" src="${m.avatar}">
      <div class="msg-content">
        <b>${m.name}</b><time>${new Date(m.createdAt?.seconds*1000).toLocaleTimeString()}</time>
        <div>${m.type==="gif"?`<img class="gif" src="${m.text}">`:m.text}</div>
        <div class="reactions">
          <span>❤️</span><span>🔥</span><span>😂</span>
        </div>
      </div>
    </div>`;
  });
  box.scrollTop=box.scrollHeight;
});

window.send=async()=>{
  const t=text.value;
  if(!t)return;
  await addDoc(ref,{
    text:t,
    name:auth.currentUser.displayName||"User",
    avatar:auth.currentUser.photoURL,
    createdAt:serverTimestamp()
  });
  text.value="";
};

const API="0GqIeLqsCjxbpdCUUiVNe4JzSMwKQqsQ";

window.toggleGif=()=>{
  gifPanel.style.display=gifPanel.style.display==="block"?"none":"block";
  loadTrending();
};

async function loadTrending(){
  const r=await fetch(`https://api.giphy.com/v1/gifs/trending?api_key=${API}&limit=20`);
  const j=await r.json();
  renderGif(j.data);
}

window.searchGif=async()=>{
  const q=gifSearch.value;
  if(!q)return loadTrending();
  const r=await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${API}&q=${q}&limit=20`);
  const j=await r.json();
  renderGif(j.data);
};

function renderGif(arr){
  gifGrid.innerHTML="";
  arr.forEach(g=>{
    const img=document.createElement("img");
    img.src=g.images.fixed_width.url;
    img.onclick=()=>sendGif(img.src);
    gifGrid.appendChild(img);
  });
}

async function sendGif(url){
  await addDoc(ref,{
    text:url,
    type:"gif",
    name:auth.currentUser.displayName||"User",
    avatar:auth.currentUser.photoURL,
    createdAt:serverTimestamp()
  });
  gifPanel.style.display="none";
}
</script>

</body>
</html>
