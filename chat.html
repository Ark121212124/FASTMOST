<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST · Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ВНЕШНИЕ СТИЛИ -->
<link rel="stylesheet" href="styles.css">

<!-- Emoji Picker -->
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>

<body>

<!-- HEADER -->
<header class="chat-header">
  <button class="back-btn" onclick="history.back()">← Назад</button>
  <span class="chat-title">FASTMOST · Chat</span>
</header>

<!-- CHAT -->
<main id="messages" class="chat-messages"></main>

<!-- FOOTER -->
<footer class="chat-input">
  <button id="emojiBtn" class="icon-btn">😊</button>
  <button id="gifBtn" class="icon-btn">GIF</button>
  <input id="text" type="text" placeholder="Сообщение…">
  <button id="sendBtn" class="send-btn">➤</button>
</footer>

<!-- EMOJI PICKER -->
<emoji-picker id="emojiPicker" class="emoji-picker"></emoji-picker>

<!-- GIF PANEL -->
<div id="gifPanel" class="gif-panel">
  <img src="https://media.giphy.com/media/l0MYC0LajbaPoEADu/giphy.gif">
  <img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif">
  <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
  <img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif">
</div>

<script>
/* ---------- CONFIG ---------- */
const room =
  new URLSearchParams(location.search).get('room') || 'default';
const STORAGE_KEY = 'fastmost_chat_' + room;

/* ---------- ELEMENTS ---------- */
const messages = document.getElementById('messages');
const text = document.getElementById('text');
const sendBtn = document.getElementById('sendBtn');
const emojiBtn = document.getElementById('emojiBtn');
const gifBtn = document.getElementById('gifBtn');
const emojiPicker = document.getElementById('emojiPicker');
const gifPanel = document.getElementById('gifPanel');

/* ---------- LOAD ---------- */
const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
saved.forEach(renderMessage);

/* ---------- SEND TEXT ---------- */
sendBtn.onclick = send;
text.addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

function send() {
  if (!text.value.trim()) return;

  const msg = { type: 'text', value: text.value };
  save(msg);
  renderMessage(msg);
  text.value = '';
}

/* ---------- SAVE ---------- */
function save(msg) {
  const arr = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  arr.push(msg);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

/* ---------- RENDER ---------- */
function renderMessage(msg) {
  const div = document.createElement('div');
  div.className = 'message';

  if (msg.type === 'gif') {
    const img = document.createElement('img');
    img.src = msg.value;
    img.className = 'gif-message';
    div.appendChild(img);
  } else {
    div.textContent = msg.value;
  }

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* ---------- EMOJI ---------- */
emojiBtn.onclick = () => {
  emojiPicker.classList.toggle('show');
  gifPanel.classList.remove('show');
};

emojiPicker.addEventListener('emoji-click', e => {
  text.value += e.detail.unicode;
  text.focus();
});

/* ---------- GIF ---------- */
gifBtn.onclick = () => {
  gifPanel.classList.toggle('show');
  emojiPicker.classList.remove('show');
};

gifPanel.querySelectorAll('img').forEach(img => {
  img.onclick = () => {
    const msg = { type: 'gif', value: img.src };
    save(msg);
    renderMessage(msg);
    gifPanel.classList.remove('show');
  };
});
</script>

</body>
</html>
