<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>FASTMOST — Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084",
  storageBucket: "fastmost-f8084.appspot.com",
  messagingSenderId: "153310068244",
  appId: "1:153310068244:web:f0cce97ba520da38dc3101"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.auth = auth;
window.db = db;
window.addDoc = addDoc;
window.collection = collection;
window.query = query;
window.orderBy = orderBy;
window.onSnapshot = onSnapshot;
window.serverTimestamp = serverTimestamp;
window.doc = doc;
window.updateDoc = updateDoc;
</script>

<!-- Emoji Picker -->
<script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js" type="module"></script>

<style>
body {
  margin: 0;
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #1b1f3b, #0a0c1a);
  color: white;
  height: 100vh;
  display: flex;
}

.sidebar {
  width: 220px;
  background: rgba(20,25,50,.7);
  backdrop-filter: blur(20px);
  padding: 20px;
}

.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 16px;
  font-size: 20px;
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.msg {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
  animation: fadeIn .2s ease;
}

.msg img.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
}

.msg-content {
  background: rgba(255,255,255,.08);
  padding: 10px 14px;
  border-radius: 14px;
  max-width: 520px;
  position: relative;
}

.msg-content:hover .edit {
  opacity: 1;
}

.edit {
  position: absolute;
  top: 6px;
  right: 8px;
  cursor: pointer;
  opacity: 0;
}

.msg-content img.gif {
  max-width: 250px;
  border-radius: 12px;
}

.input {
  display: flex;
  gap: 10px;
  padding: 16px;
  background: rgba(20,25,50,.8);
}

.input input {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: none;
  background: rgba(255,255,255,.1);
  color: white;
}

.input button {
  padding: 0 16px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg,#6d7cff,#8a5cff);
  color: white;
}

#gifPanel {
  display: none;
  padding: 10px;
  max-height: 220px;
  overflow-y: auto;
  background: rgba(0,0,0,.6);
}

#gifPanel img {
  width: 120px;
  border-radius: 12px;
  cursor: pointer;
  margin: 6px;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:none; }
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>FASTMOST</h3>
  <button onclick="toggleGIF()">🎞 GIF</button>
  <button onclick="toggleEmoji()">😀 Emoji</button>
</div>

<div class="chat">
  <div class="header">Чат</div>

  <div id="messages" class="messages"></div>

  <div id="gifPanel"></div>

  <emoji-picker id="emojiPicker" style="display:none"></emoji-picker>

  <div class="input">
    <input id="text" placeholder="Сообщение..." />
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
const GIPHY_API_KEY = "0GqIeLqsCjxbpdCUUiVNe4JzSMwKQqsQ";
const params = new URLSearchParams(location.search);
const room = params.get("room");

const messagesRef = collection(db, "rooms", room, "messages");

onSnapshot(query(messagesRef, orderBy("createdAt")), snap => {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  snap.forEach(doc => {
    const m = doc.data();
    box.innerHTML += `
      <div class="msg">
        <img class="avatar" src="${m.avatar}">
        <div class="msg-content">
          ${m.type === "gif" ? `<img class="gif" src="${m.text}">` : m.text}
        </div>
      </div>`;
  });
  box.scrollTop = box.scrollHeight;
});

function send(text = null, type = "text") {
  const input = document.getElementById("text");
  addDoc(messagesRef, {
    text: text || input.value,
    type,
    avatar: auth.currentUser.photoURL || "https://i.imgur.com/6VBx3io.png",
    createdAt: serverTimestamp()
  });
  input.value = "";
}

async function toggleGIF() {
  const panel = document.getElementById("gifPanel");
  panel.style.display = panel.style.display === "block" ? "none" : "block";
  panel.innerHTML = "Загрузка...";
  const res = await fetch(`https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY_API_KEY}&limit=20`);
  const data = await res.json();
  panel.innerHTML = "";
  data.data.forEach(g => {
    const img = document.createElement("img");
    img.src = g.images.fixed_height.url;
    img.onclick = () => send(img.src,"gif");
    panel.appendChild(img);
  });
}

function toggleEmoji() {
  const picker = document.getElementById("emojiPicker");
  picker.style.display = picker.style.display === "none" ? "block" : "none";
}

document.getElementById("emojiPicker").addEventListener("emoji-click", e => {
  document.getElementById("text").value += e.detail.unicode;
});
</script>

</body>
</html>
