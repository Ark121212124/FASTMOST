<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FASTMOST • Чат</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5865f2">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
/* ================= THEMES ================= */
body[data-theme="purple"]{
  --accent:#5865f2;
  --bg:#070b16;
}
body[data-theme="cyber"]{
  --accent:#00ffe1;
  --bg:#020d0c;
}
body[data-theme="red"]{
  --accent:#ff3b3b;
  --bg:#120405;
}

:root{
  --panel:rgba(20,25,45,.65);
  --text:#e6e9ff;
  --blur:blur(14px);
}

/* ================= BASE ================= */
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  font-family:Inter,system-ui;
  background:radial-gradient(1200px 600px at top,var(--accent)10%,transparent),var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */
header{
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--panel);
  backdrop-filter:var(--blur);
}

header button{
  background:var(--accent);
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
}

/* ================= CHAT ================= */
#chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.message{
  display:flex;
  gap:12px;
  margin-bottom:14px;
}

.message img{
  width:42px;
  height:42px;
  border-radius:50%;
}

.bubble{
  background:var(--panel);
  backdrop-filter:var(--blur);
  padding:10px 14px;
  border-radius:14px;
  max-width:70%;
  position:relative;
}

.bubble .name{
  font-size:12px;
  opacity:.7;
}

.bubble .text{
  margin-top:4px;
  white-space:pre-wrap;
}

.actions{
  margin-top:6px;
  display:flex;
  gap:8px;
}

.actions span{
  cursor:pointer;
  font-size:12px;
  opacity:.6;
}
.actions span:hover{opacity:1}

/* ================= INPUT ================= */
footer{
  padding:12px;
  display:flex;
  gap:10px;
  background:var(--panel);
  backdrop-filter:var(--blur);
}

footer input{
  flex:1;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
}

footer button{
  background:var(--accent);
  border:none;
  color:#fff;
  padding:0 16px;
  border-radius:12px;
  cursor:pointer;
}

/* ================= GIF PANEL ================= */
#gifPanel{
  position:fixed;
  bottom:80px;
  left:20px;
  right:20px;
  max-height:320px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  border-radius:16px;
  padding:10px;
  display:none;
  overflow:auto;
}

.gif-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:8px;
}

.gif-grid img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

/* ================= VOICE OVERLAY ================= */
#voiceOverlay{
  position:fixed;
  top:20px;
  right:20px;
  background:var(--panel);
  backdrop-filter:var(--blur);
  padding:12px 16px;
  border-radius:14px;
  display:none;
}
</style>
</head>

<body data-theme="purple">

<header>
  <strong>FASTMOST • Чат</strong>
  <div>
    <button onclick="toggleVoice()">🎧 Voice</button>
    <button onclick="toggleTheme()">🎨</button>
  </div>
</header>

<div id="chat"></div>

<div id="gifPanel">
  <input id="gifSearch" placeholder="Поиск GIF…" oninput="searchGif()" />
  <div class="gif-grid" id="gifGrid"></div>
</div>

<footer>
  <button onclick="openGif()">GIF</button>
  <input id="msg" placeholder="Сообщение…" />
  <button onclick="send()">➤</button>
</footer>

<div id="voiceOverlay">🔊 Voice активен</div>

<script>
/* ================= FIREBASE ================= */
firebase.initializeApp({
  // 🔥 ВСТАВЬ СВОЙ CONFIG
});
const db=firebase.firestore();
const auth=firebase.auth();

/* ================= STATE ================= */
let theme=["purple","cyber","red"];
let t=0;

/* ================= CHAT ================= */
function send(text=null){
  const msg=text||document.getElementById("msg").value;
  if(!msg)return;
  db.collection("messages").add({
    text:msg,
    uid:auth.currentUser.uid,
    name:auth.currentUser.email,
    avatar:auth.currentUser.photoURL||"",
    time:Date.now()
  });
  document.getElementById("msg").value="";
}

db.collection("messages").orderBy("time").onSnapshot(s=>{
  chat.innerHTML="";
  s.forEach(d=>{
    const m=d.data();
    chat.innerHTML+=`
      <div class="message">
        <img src="${m.avatar||'https://i.imgur.com/6VBx3io.png'}">
        <div class="bubble">
          <div class="name">${m.name}</div>
          <div class="text">${m.text}</div>
          <div class="actions">
            <span onclick="edit('${d.id}','${m.text}')">✏️</span>
            <span onclick="reply('${m.text}')">↩️</span>
          </div>
        </div>
      </div>`;
  });
  chat.scrollTop=chat.scrollHeight;
});

/* ================= EDIT / REPLY ================= */
function edit(id,text){
  const n=prompt("Редактировать:",text);
  if(n)db.collection("messages").doc(id).update({text:n});
}
function reply(t){
  msg.value="> "+t+"\n";
}

/* ================= GIF ================= */
const GIPHY="0GqIeLqsCjxbpdCUUiVNe4JzSMwKQqsQ";
function openGif(){
  gifPanel.style.display="block";
  loadTrending();
}
function loadTrending(){
  fetch(`https://api.giphy.com/v1/gifs/trending?api_key=${GIPHY}&limit=12`)
  .then(r=>r.json()).then(d=>{
    gifGrid.innerHTML="";
    d.data.forEach(g=>{
      gifGrid.innerHTML+=`<img src="${g.images.fixed_width.url}" onclick="send('${g.images.fixed_width.url}')">`;
    });
  });
}
function searchGif(){
  const q=gifSearch.value;
  if(!q)return loadTrending();
  fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY}&q=${q}&limit=12`)
  .then(r=>r.json()).then(d=>{
    gifGrid.innerHTML="";
    d.data.forEach(g=>{
      gifGrid.innerHTML+=`<img src="${g.images.fixed_width.url}" onclick="send('${g.images.fixed_width.url}')">`;
    });
  });
}

/* ================= VOICE ================= */
function toggleVoice(){
  voiceOverlay.style.display=
    voiceOverlay.style.display==="block"?"none":"block";
}

/* ================= THEME ================= */
function toggleTheme(){
  t=(t+1)%theme.length;
  document.body.dataset.theme=theme[t];
}
</script>
</body>
</html>
