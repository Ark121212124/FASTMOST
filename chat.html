<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5865F2">

<style>
body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(135deg,#0b1022,#12193a);
  color: #fff;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  padding: 14px;
  background: rgba(0,0,0,.3);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  gap: 10px;
}

header button {
  background: #5865F2;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  color: #fff;
  cursor: pointer;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.msg {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  animation: fade .2s ease;
}

@keyframes fade {
  from {opacity:0;transform:translateY(6px)}
  to {opacity:1;transform:none}
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
}

.msg-box {
  background: rgba(255,255,255,.06);
  border-radius: 12px;
  padding: 10px 14px;
  max-width: 70%;
}

.msg-box small {
  opacity: .6;
}

.reactions span {
  cursor: pointer;
  margin-right: 6px;
  font-size: 14px;
}

.edit {
  cursor: pointer;
  opacity: .5;
  margin-left: 6px;
}

footer {
  display: flex;
  gap: 8px;
  padding: 14px;
  background: rgba(0,0,0,.4);
}

footer input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

footer button {
  background: #5865F2;
  border: none;
  padding: 12px;
  border-radius: 10px;
  color: #fff;
  cursor: pointer;
}
.gif {
  max-width: 220px;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <button onclick="history.back()">← Назад</button>
  <b>Чат FASTMOST</b>
</header>

<div id="messages"></div>

<footer>
  <button onclick="openGif()">GIF</button>
  <input id="text" placeholder="Сообщение...">
  <button onclick="send()">➤</button>
</footer>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot,
  query, orderBy, serverTimestamp,
  doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "ВСТАВЬ",
  authDomain: "ВСТАВЬ",
  projectId: "ВСТАВЬ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const params = new URLSearchParams(location.search);
const room = params.get("room");

const messagesRef = collection(db,"rooms",room,"messages");
const q = query(messagesRef, orderBy("createdAt"));

const box = document.getElementById("messages");

onSnapshot(q,snap=>{
  box.innerHTML = "";
  snap.forEach(d=>{
    const m = d.data();
    box.innerHTML += `
    <div class="msg">
      <img class="avatar" src="${m.avatar}">
      <div class="msg-box">
        ${m.type==="gif"?`<img class="gif" src="${m.text}">`:m.text}
        ${m.edited?"<small>(изменено)</small>":""}
        <div class="reactions">
          <span onclick="react('${d.id}','❤️')">❤️ ${m.reactions?.["❤️"]||0}</span>
          <span onclick="react('${d.id}','🔥')">🔥 ${m.reactions?.["🔥"]||0}</span>
          <span onclick="react('${d.id}','😂')">😂 ${m.reactions?.["😂"]||0}</span>
          ${m.uid===auth.currentUser?.uid?`<span class="edit" onclick="editMsg('${d.id}','${m.text}')">✏</span>`:""}
        </div>
      </div>
    </div>`;
  });
  box.scrollTop = box.scrollHeight;
});

window.send = async ()=>{
  const text = document.getElementById("text").value;
  if(!text) return;
  await addDoc(messagesRef,{
    text,
    uid: auth.currentUser.uid,
    avatar: auth.currentUser.photoURL,
    createdAt: serverTimestamp()
  });
  document.getElementById("text").value="";
};

window.react = async(id,emoji)=>{
  const ref = doc(db,"rooms",room,"messages",id);
  await updateDoc(ref,{
    [`reactions.${emoji}`]: Math.floor(Math.random()*1)+1
  });
};

window.editMsg = async(id,oldText)=>{
  const t = prompt("Редактировать:",oldText);
  if(!t) return;
  await updateDoc(doc(db,"rooms",room,"messages",id),{
    text:t,
    edited:true
  });
};

window.openGif = async ()=>{
  const q = prompt("Поиск GIF");
  if(!q) return;
  const r = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=0GqIeLqsCjxbpdCUUiVNe4JzSMwKQqsQ&q=${q}&limit=1`);
  const j = await r.json();
  const gif = j.data[0]?.images.fixed_width.url;
  if(!gif) return;
  await addDoc(messagesRef,{
    text: gif,
    type:"gif",
    uid: auth.currentUser.uid,
    avatar: auth.currentUser.photoURL,
    createdAt: serverTimestamp()
  });
};
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
