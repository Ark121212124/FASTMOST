<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
:root{
  --bg:#0b1020;
  --panel:#11173a;
  --accent:#5865f2;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  background:radial-gradient(1200px 600px at top,#141a40,#070b18);
  font-family:Inter,Arial;
  color:white;
}

.chat{
  display:flex;
  flex-direction:column;
  height:100vh;
}

/* header */
.chat-header{
  height:56px;
  display:flex;
  align-items:center;
  padding:0 16px;
  background:rgba(20,25,55,.8);
}

/* messages */
.messages{
  flex:1;
  padding:14px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.msg{
  max-width:70%;
  padding:10px 14px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  animation:fade .2s ease;
}

.msg.me{
  align-self:flex-end;
  background:linear-gradient(135deg,#5865f2,#7b83ff);
}

@keyframes fade{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1}
}

/* input */
.chat-input{
  display:flex;
  gap:8px;
  padding:10px;
  background:rgba(10,14,35,.9);
}

.chat-input input{
  flex:1;
  height:42px;
  border:none;
  border-radius:12px;
  padding:0 14px;
  background:rgba(255,255,255,.08);
  color:white;
}

.chat-input button{
  width:42px;
  border:none;
  border-radius:12px;
  background:var(--accent);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="chat">

  <div class="chat-header">
    <button onclick="history.back()">← Назад</button>
    <div style="margin-left:12px;font-weight:600">FASTMOST · Чат</div>
  </div>

  <div id="messages" class="messages"></div>

  <div class="chat-input">
    <button title="Emoji">😊</button>
    <input id="text" placeholder="Сообщение..." />
    <button onclick="send()">➤</button>
  </div>

</div>

<script>
function send(){
  const input=document.getElementById('text');
  const text=input.value.trim();
  if(!text)return;

  const msg=document.createElement('div');
  msg.className='msg me';
  msg.textContent=text;

  document.getElementById('messages').appendChild(msg);
  input.value='';
  document.getElementById('messages').scrollTop=999999;
}

document.getElementById('text')
  .addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>

</body>
</html>
