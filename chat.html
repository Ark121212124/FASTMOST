<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST · Chat</title>

<link rel="stylesheet" href="styles.css">

<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
</head>
<body>

<div class="chat-header">
  <a href="index.html">← Назад</a>
  <span id="roomTitle">Чат</span>
</div>

<div id="messages" class="chat-messages"></div>

<div id="emojiPanel" hidden>
  <emoji-picker></emoji-picker>
</div>

<div id="gifPanel" hidden>
  <img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif">
  <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
</div>

<div class="chat-input">
  <button id="emojiBtn">😃</button>
  <button id="gifBtn">GIF</button>
  <input id="messageInput" placeholder="Сообщение...">
  <button id="sendBtn">➤</button>
</div>

<script type="module" src="chat.js"></script>
</body>
</html>
