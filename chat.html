<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FASTMOST · Chat</title>

  <link rel="stylesheet" href="styles.css">

  <script type="module"
    src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js">
  </script>
</head>

<body>

<div class="chat-header">
  <a href="index.html" class="back-btn">← Назад</a>
  <strong>FASTMOST · Chat</strong>
</div>

<div class="chat-messages" id="messages"></div>

<div class="emoji-panel hidden" id="emojiPanel">
  <emoji-picker></emoji-picker>
</div>

<div class="gif-panel hidden" id="gifPanel">
  <img src="https://media.giphy.com/media/ICOgUNjpvO0PC/giphy.gif">
  <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
</div>

<div class="chat-input">
  <button id="emojiBtn">😃</button>
  <button id="gifBtn">GIF</button>
  <input id="messageInput" placeholder="Сообщение...">
  <button id="sendBtn">➤</button>
</div>

<!-- ВСЯ ЛОГИКА В ОДНОМ MODULE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "ТВОЙ_API_KEY",
  authDomain: "ТВОЙ.firebaseapp.com",
  projectId: "ТВОЙ_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* DOM */
const messages = document.getElementById("messages");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const emojiBtn = document.getElementById("emojiBtn");
const gifBtn = document.getElementById("gifBtn");
const emojiPanel = document.getElementById("emojiPanel");
const gifPanel = document.getElementById("gifPanel");

const roomId =
  new URLSearchParams(location.search).get("room") || "global";

/* SEND MESSAGE */
async function sendMessage(text){
  if(!text.trim()) return;

  await addDoc(
    collection(db,"rooms",roomId,"messages"),
    {
      text,
      createdAt: Date.now()
    }
  );

  input.value = "";
}

sendBtn.addEventListener("click",()=>{
  sendMessage(input.value);
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    sendMessage(input.value);
  }
});

/* LOAD MESSAGES */
const q = query(
  collection(db,"rooms",roomId,"messages"),
  orderBy("createdAt")
);

onSnapshot(q,snap=>{
  messages.innerHTML="";
  snap.forEach(doc=>{
    const m = document.createElement("div");
    m.className = "message";
    m.innerHTML = doc.data().text;
    messages.appendChild(m);
  });
  messages.scrollTop = messages.scrollHeight;
});

/* EMOJI */
emojiBtn.onclick = ()=>{
  emojiPanel.classList.toggle("hidden");
  gifPanel.classList.add("hidden");
};

document
  .querySelector("emoji-picker")
  .addEventListener("emoji-click",e=>{
    input.value += e.detail.unicode;
  });

/* GIF */
gifBtn.onclick = ()=>{
  gifPanel.classList.toggle("hidden");
  emojiPanel.classList.add("hidden");
};

gifPanel.querySelectorAll("img").forEach(img=>{
  img.onclick = ()=>{
    sendMessage(`<img src="${img.src}" class="gif-msg">`);
    gifPanel.classList.add("hidden");
  };
});
</script>

</body>
</html>
