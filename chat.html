<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root{
  --bg:#070b1a;
  --panel:#111737;
  --accent:#6c7cff;
}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{
  margin:0;
  background:radial-gradient(1000px 600px at top,#182061,#050710);
  color:#fff;
  display:flex;
  flex-direction:column;
  height:100vh;
}
header{
  padding:14px;
  background:rgba(0,0,0,.4);
  display:flex;
  gap:10px;
  align-items:center;
}
header button{
  background:var(--accent);
  border:none;
  border-radius:10px;
  padding:8px 12px;
  color:#fff;
}
#messages{
  flex:1;
  padding:20px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.msg{
  background:var(--panel);
  padding:10px 14px;
  border-radius:14px;
  max-width:70%;
}
.me{align-self:flex-end;background:#1c265c}
.footer{
  padding:10px;
  background:rgba(0,0,0,.6);
  display:flex;
  gap:8px;
}
.footer input{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#0e1430;
  color:#fff;
}
.footer button{
  border:none;
  border-radius:12px;
  padding:0 14px;
  background:var(--accent);
  color:#fff;
}
.gif-panel{
  display:none;
  padding:10px;
  background:#0b1025;
  gap:10px;
  overflow-x:auto;
}
.gif-panel img{
  height:80px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <button onclick="history.back()">← Назад</button>
  FASTMOST · Chat
</header>

<div id="messages"></div>

<div class="gif-panel" id="gifs"></div>

<div class="footer">
  <button onclick="toggleEmoji()">😊</button>
  <button onclick="toggleGif()">GIF</button>
  <input id="text" placeholder="Сообщение...">
  <button onclick="send()">➤</button>
</div>

<script>
const room = new URLSearchParams(location.search).get('room');
const key = 'chat_'+room;
const msgs = JSON.parse(localStorage.getItem(key)||'[]');

function save(){localStorage.setItem(key,JSON.stringify(msgs));}

function render(){
  messages.innerHTML='';
  msgs.forEach(m=>{
    const d=document.createElement('div');
    d.className='msg me';
    d.innerHTML=m;
    messages.appendChild(d);
  });
  messages.scrollTop=99999;
}
render();

function send(){
  if(!text.value.trim()) return;
  msgs.push(text.value);
  text.value='';
  save();render();
}

function toggleEmoji(){
  text.value+='😊';
  text.focus();
}

const gifList=[
 'https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif',
 'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif',
 'https://media.giphy.com/media/26BRuo6sLetdllPAQ/giphy.gif'
];

function toggleGif(){
  gifs.innerHTML='';
  gifList.forEach(url=>{
    const img=document.createElement('img');
    img.src=url;
    img.onclick=()=>{
      msgs.push(`<img src="${url}" style="max-width:200px;border-radius:12px">`);
      save();render();
      gifs.style.display='none';
    };
    gifs.appendChild(img);
  });
  gifs.style.display=gifs.style.display==='flex'?'none':'flex';
}
</script>
</body>
</html>
