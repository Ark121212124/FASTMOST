<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
html, body {
  height: 100%;
  margin: 0;
  background: radial-gradient(1200px 600px at top, #151a33, #070b18);
  font-family: Inter, Arial, sans-serif;
  color: #fff;
}

/* Верхняя панель */
.chat-header {
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 16px;
  background: rgba(20,25,55,.6);
  backdrop-filter: blur(10px);
}

/* Контейнер чата */
.chat-wrapper {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 56px);
}

/* Сообщения */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  gap: 8px;
  display: flex;
  flex-direction: column;
}

/* Одно сообщение */
.message {
  max-width: 70%;
  padding: 10px 14px;
  border-radius: 14px;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(6px);
  animation: fadeUp .2s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Мой текст */
.message.me {
  align-self: flex-end;
  background: linear-gradient(135deg,#5865f2,#7b83ff);
}

/* Нижний бар */
.chat-input {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(10,14,35,.9);
  backdrop-filter: blur(10px);
}

/* Поле */
.chat-input input {
  flex: 1;
  height: 42px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,.07);
  padding: 0 14px;
  color: white;
  outline: none;
}

/* Кнопки */
.chat-input button {
  height: 42px;
  min-width: 42px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg,#5865f2,#7b83ff);
  color: white;
  cursor: pointer;
}
</head>

<body>

<div class="header">
<button onclick="history.back()">← Назад</button>
</div>

<div class="messages" id="messages"></div>

<div class="input">
<button onclick="sendGif()">GIF</button>
<input id="text" placeholder="Сообщение">
<button onclick="send()">➤</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const room = new URLSearchParams(location.search).get("room");

function send() {
  if(!text.value) return;
  db.collection("rooms").doc(room)
    .collection("messages")
    .add({
      text: text.value,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  text.value="";
}

function sendGif() {
  fetch(`https://api.giphy.com/v1/gifs/trending?api_key=0GqIeLqsCjxbpdCUUiVNe4JzSMwKQqsQ&limit=1`)
    .then(r=>r.json())
    .then(d=>{
      const url = d.data[0].images.fixed_width.url;
      db.collection("rooms").doc(room)
        .collection("messages")
        .add({
          gif:url,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    });
}

db.collection("rooms").doc(room)
  .collection("messages")
  .orderBy("createdAt")
  .onSnapshot(snap=>{
    messages.innerHTML="";
    snap.forEach(doc=>{
      const m = doc.data();
      const div = document.createElement("div");
      div.className="msg";

      if(m.text) div.textContent = m.text;
      if(m.gif) {
        const img = document.createElement("img");
        img.src = m.gif;
        img.className="gif";
        div.appendChild(img);
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });
  });
</script>

</body>
</html>
