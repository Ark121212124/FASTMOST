<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>FASTMOST · Chat</title>

  <!-- ТВОИ СТИЛИ -->
  <link rel="stylesheet" href="styles.css">

  <!-- Emoji Picker -->
  <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js" defer></script>

  <!-- Firebase (если уже используешь) -->
  <script type="module" src="chat.js" defer></script>
</head>
<body>

<!-- HEADER -->
<header class="chat-header">
  <a href="index.html" class="back-btn">← Назад</a>
  <span class="chat-title">FASTMOST · Chat</span>
</header>

<!-- MESSAGES -->
<main class="chat-messages" id="messages"></main>

<!-- EMOJI PICKER (СКРЫТ) -->
<div class="emoji-panel hidden" id="emojiPanel">
  <emoji-picker></emoji-picker>
</div>

<!-- CHAT INPUT (ВСЕГДА ВНИЗУ) -->
<footer class="chat-input">
  <button id="emojiBtn" class="emoji-btn">🙂</button>

  <input
    type="text"
    id="messageInput"
    placeholder="Сообщение..."
    autocomplete="off"
  />

  <button id="sendBtn" class="send-btn">➤</button>
</footer>

<!-- LOGIC -->
<script>
  const messages = document.getElementById("messages");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const emojiBtn = document.getElementById("emojiBtn");
  const emojiPanel = document.getElementById("emojiPanel");
  const picker = document.querySelector("emoji-picker");

  // Показ / скрытие эмодзи
  emojiBtn.onclick = () => {
    emojiPanel.classList.toggle("hidden");
  };

  // Вставка эмодзи
  picker.addEventListener("emoji-click", e => {
    input.value += e.detail.unicode;
    input.focus();
  });

  // Отправка сообщения
  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    const msg = document.createElement("div");
    msg.className = "message";
    msg.textContent = text;

    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
    input.value = "";
  }

  sendBtn.onclick = sendMessage;

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
