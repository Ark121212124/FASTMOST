<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body style="display:flex;flex-direction:column;height:100vh">

<div class="chat-header">
  <button onclick="history.back()">← Назад</button>
  FASTMOST · Chat
</div>

<div id="messages" class="chat-body"></div>

<div id="gifs" class="gif-panel"></div>

<div class="chat-footer">
  <button onclick="addEmoji()">😊</button>
  <button onclick="toggleGif()">GIF</button>
  <input id="text" placeholder="Сообщение…">
  <button onclick="send()">➤</button>
</div>

<script>
const room=new URLSearchParams(location.search).get('room');
const key='chat_'+room;
const msgs=JSON.parse(localStorage.getItem(key)||'[]');

function save(){localStorage.setItem(key,JSON.stringify(msgs));}

function render(){
  messages.innerHTML='';
  msgs.forEach(m=>{
    const d=document.createElement('div');
    d.className='message me';
    d.innerHTML=m;
    messages.appendChild(d);
  });
  messages.scrollTop=99999;
}
render();

function send(){
  if(!text.value.trim())return;
  msgs.push(text.value);
  text.value='';
  save();render();
}

function addEmoji(){
  text.value+='😊';
  text.focus();
}

const gifList=[
 'https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif',
 'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif',
 'https://media.giphy.com/media/26BRuo6sLetdllPAQ/giphy.gif'
];

function toggleGif(){
  gifs.innerHTML='';
  gifList.forEach(url=>{
    const img=document.createElement('img');
    img.src=url;
    img.onclick=()=>{
      msgs.push(`<img src="${url}" style="max-width:220px;border-radius:14px">`);
      save();render();
      gifs.style.display='none';
    };
    gifs.appendChild(img);
  });
  gifs.style.display=gifs.style.display==='flex'?'none':'flex';
}
</script>

</body>
</html>
