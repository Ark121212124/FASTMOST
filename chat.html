<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST Chat</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin:0;
  background:#0b1020;
  color:white;
  font-family:Arial;
}
.header {
  padding:15px;
  background:#141a33;
}
.messages {
  height:calc(100vh - 120px);
  overflow-y:auto;
  padding:15px;
}
.msg {
  background:#1b2347;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
.input {
  display:flex;
  gap:10px;
  padding:10px;
  background:#141a33;
}
input {
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
}
button {
  padding:12px;
  border:none;
  border-radius:10px;
  background:#5865f2;
  color:white;
  cursor:pointer;
}
.gif {
  max-width:200px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="header">
<button onclick="history.back()">← Назад</button>
</div>

<div class="messages" id="messages"></div>

<div class="input">
<button onclick="sendGif()">GIF</button>
<input id="text" placeholder="Сообщение">
<button onclick="send()">➤</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyACZRa6uGHLGIYhLvN6-IeKZ_Ees28zYCM",
  authDomain: "fastmost-f8084.firebaseapp.com",
  projectId: "fastmost-f8084"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const room = new URLSearchParams(location.search).get("room");

function send() {
  if(!text.value) return;
  db.collection("rooms").doc(room)
    .collection("messages")
    .add({
      text: text.value,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  text.value="";
}

function sendGif() {
  fetch(`https://api.giphy.com/v1/gifs/trending?api_key=0GqIeLqsCjxbpdCUUiVNe4JzSMwKQqsQ&limit=1`)
    .then(r=>r.json())
    .then(d=>{
      const url = d.data[0].images.fixed_width.url;
      db.collection("rooms").doc(room)
        .collection("messages")
        .add({
          gif:url,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    });
}

db.collection("rooms").doc(room)
  .collection("messages")
  .orderBy("createdAt")
  .onSnapshot(snap=>{
    messages.innerHTML="";
    snap.forEach(doc=>{
      const m = doc.data();
      const div = document.createElement("div");
      div.className="msg";

      if(m.text) div.textContent = m.text;
      if(m.gif) {
        const img = document.createElement("img");
        img.src = m.gif;
        img.className="gif";
        div.appendChild(img);
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    });
  });
</script>

</body>
</html>
