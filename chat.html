<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>FASTMOST Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f1f">

<style>
:root{
  --bg-main:#070b18;
  --bg-panel:#0c1228;
  --bg-glass:rgba(255,255,255,0.04);
  --border-glass:rgba(255,255,255,0.08);
  --accent:#5865F2;
  --text:#e7e9ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at top,#121a3d,#070b18 60%);
  font-family:Inter,system-ui;
  color:var(--text);
}

/* HEADER */
header{
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border-glass);
}

header button{
  background:var(--bg-glass);
  border:1px solid var(--border-glass);
  color:var(--text);
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
}

/* CHAT */
#messages{
  flex:1;
  overflow-y:auto;
  padding:22px;
}

.msg{
  display:flex;
  gap:14px;
  margin-bottom:18px;
  animation:fade .25s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1}
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
}

.msg-content{
  background:var(--bg-glass);
  border:1px solid var(--border-glass);
  border-radius:16px;
  padding:12px 14px;
  max-width:65%;
  backdrop-filter:blur(12px);
}

.msg-content b{
  font-size:14px;
}

.msg-content time{
  font-size:11px;
  opacity:.45;
  margin-left:6px;
}

.gif{
  max-width:240px;
  border-radius:12px;
  margin-top:6px;
}

/* FOOTER INPUT */
footer{
  padding:14px;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--border-glass);
  display:flex;
  justify-content:center;
}

.input-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:8px 10px;
  width:100%;
  max-width:760px; /* 🔥 ограничение ширины */
}

.input-box input{
  flex:1;
  background:transparent;
  border:none;
  color:var(--text);
  padding:10px;
  font-size:14px;
  outline:none;
}

.input-box button{
  background:var(--accent);
  border:none;
  color:white;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.input-box button:hover{
  transform:scale(1.05);
}

/* GIF PANEL */
#gifPanel{
  position:absolute;
  bottom:88px;
  left:50%;
  transform:translateX(-50%);
  width:760px;
  max-width:94%;
  background:#0c132f;
  border:1px solid var(--border-glass);
  border-radius:18px;
  padding:14px;
  display:none;
  box-shadow:0 30px 80px rgba(0,0,0,0.7);
}

#gifPanel input{
  width:100%;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border-glass);
  color:white;
  margin-bottom:12px;
}

.gif-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
  max-height:280px;
  overflow:auto;
}

.gif-grid img{
  width:100%;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}

.gif-grid img:hover{
  transform:scale(1.06);
}
</style>
</head>

<body>

<header>
  <button onclick="history.back()">←</button>
  <b>FASTMOST · Чат</b>
</header>

<div id="messages"></div>

<div id="gifPanel">
  <input placeholder="Поиск GIF..." oninput="searchGif(this.value)">
  <div class="gif-grid" id="gifGrid"></div>
</div>

<footer>
  <div class="input-box">
    <button onclick="toggleGif()">GIF</button>
    <input id="text" placeholder="Написать сообщение…">
    <button onclick="send()">➤</button>
  </div>
</footer>

<script>
const API="0GqIeLqsCjxbpdCUUiVNe4JzSMwKQqsQ";

function toggleGif(){
  gifPanel.style.display=gifPanel.style.display==="block"?"none":"block";
  loadTrending();
}

async function loadTrending(){
  const r=await fetch(`https://api.giphy.com/v1/gifs/trending?api_key=${API}&limit=24`);
  const j=await r.json();
  renderGif(j.data);
}

async function searchGif(q){
  if(!q)return loadTrending();
  const r=await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${API}&q=${q}&limit=24`);
  const j=await r.json();
  renderGif(j.data);
}

function renderGif(arr){
  gifGrid.innerHTML="";
  arr.forEach(g=>{
    const img=document.createElement("img");
    img.src=g.images.fixed_width.url;
    img.onclick=()=>sendGif(img.src);
    gifGrid.appendChild(img);
  });
}

function sendGif(url){
  console.log("GIF:",url);
  gifPanel.style.display="none";
}
</script>

</body>
</html>
